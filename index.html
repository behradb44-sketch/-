<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BEHRAD AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at top right,
            #132b5c,
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            #3b1020,
            transparent 35%
        ),
        #05070d;

    color:#fff;

    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

.app{
    width:100%;
    max-width:900px;

    margin:auto;

    min-height:100vh;

    display:flex;
    flex-direction:column;
}

.header{
    position:sticky;
    top:0;
    z-index:20;

    padding:15px;

    background:
        rgba(5,7,13,.88);

    backdrop-filter:blur(18px);

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    display:flex;

    align-items:center;

    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:42px;
    height:42px;

    border-radius:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;

    background:
        linear-gradient(
            135deg,
            #00c8ff,
            #ff1744
        );

    box-shadow:
        0 0 25px
        rgba(0,200,255,.25);
}

.logo-text{
    font-weight:900;
    font-size:17px;
}

.logo-sub{
    color:#8d9ab4;
    font-size:10px;
    margin-top:3px;
}

.status{
    font-size:11px;
    color:#58ffb0;
}

.chat{
    flex:1;

    padding:
        18px
        13px
        170px;

    overflow-y:auto;
}

.welcome{
    margin-top:25vh;
    text-align:center;
}

.welcome-icon{
    font-size:55px;
    margin-bottom:15px;
}

.welcome h1{
    margin:0;
    font-size:30px;
}

.welcome p{
    color:#8d9ab4;

    font-size:13px;

    line-height:1.9;
}

.message{
    display:flex;
    margin:15px 0;
}

.message.user{
    justify-content:flex-start;
}

.message.ai{
    justify-content:flex-end;
}

.bubble{
    max-width:92%;

    border-radius:20px;

    padding:13px 15px;

    line-height:1.9;

    font-size:14px;

    overflow:hidden;
}

.user .bubble{
    background:
        linear-gradient(
            135deg,
            #123d72,
            #102447
        );

    border:
        1px solid
        rgba(0,200,255,.18);
}

.ai .bubble{
    background:
        linear-gradient(
            135deg,
            #181525,
            #11121c
        );

    border:
        1px solid
        rgba(255,255,255,.08);
}

.preview-image{
    max-width:100%;
    max-height:350px;

    display:block;

    border-radius:14px;

    margin-bottom:10px;
}

.preview-video{
    width:100%;
    max-height:350px;

    display:block;

    border-radius:14px;

    margin-bottom:10px;

    background:#000;
}

.composer{
    position:fixed;

    bottom:0;
    left:50%;

    transform:
        translateX(-50%);

    width:100%;
    max-width:900px;

    padding:12px;

    background:
        linear-gradient(
            to top,
            rgba(5,7,13,1),
            rgba(5,7,13,.92)
        );

    backdrop-filter:blur(20px);

    border-top:
        1px solid
        rgba(255,255,255,.08);
}

.attach-preview{
    display:none;

    margin-bottom:8px;

    padding:8px;

    border-radius:15px;

    background:#0d1220;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.attach-preview.active{
    display:flex;

    align-items:center;

    gap:10px;
}

.attach-thumb{
    width:52px;
    height:52px;

    object-fit:cover;

    border-radius:10px;

    background:#000;
}

.attach-info{
    flex:1;
    min-width:0;
}

.attach-name{
    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.attach-type{
    color:#7e8ba5;

    font-size:10px;

    margin-top:3px;
}

.remove-file{
    border:0;

    background:#2a1420;

    color:#ff6685;

    width:34px;
    height:34px;

    border-radius:10px;

    cursor:pointer;
}

.input-row{
    display:flex;

    align-items:flex-end;

    gap:8px;
}

.icon-btn{
    flex:0 0 45px;

    width:45px;
    height:45px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:#101624;

    color:white;

    border-radius:14px;

    font-size:20px;

    cursor:pointer;
}

.icon-btn:disabled{
    opacity:.4;
}

.textbox{
    flex:1;

    min-height:45px;
    max-height:140px;

    resize:none;

    border:none;
    outline:none;

    border-radius:15px;

    padding:13px;

    background:#101624;

    color:white;

    font-family:inherit;

    font-size:14px;

    border:
        1px solid
        rgba(255,255,255,.08);
}

.textbox:focus{
    border-color:
        rgba(0,200,255,.4);
}

.send-btn{
    flex:0 0 48px;

    width:48px;
    height:48px;

    border:0;

    border-radius:15px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #00aeea,
            #e91e63
        );

    font-size:20px;

    cursor:pointer;
}

.send-btn:disabled{
    opacity:.45;
}

.typing{
    display:flex;

    align-items:center;

    gap:5px;
}

.dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#00c8ff;

    animation:
        bounce 1s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{

    0%,100%{
        transform:
            translateY(0);

        opacity:.4;
    }

    50%{
        transform:
            translateY(-5px);

        opacity:1;
    }

}


/* =====================================================
   MARKDOWN
===================================================== */

.bubble p{
    margin:7px 0;
}

.bubble ul,
.bubble ol{
    padding-right:22px;
}

.bubble a{
    color:#55cfff;
}

.bubble code:not(pre code){

    background:#0b101a;

    color:#7ee7ff;

    padding:
        2px 6px;

    border-radius:6px;

    direction:ltr;

    unicode-bidi:plaintext;
}

.code-wrap{

    position:relative;

    margin:12px 0;

    border-radius:13px;

    overflow:hidden;

    background:#070a10;

    border:
        1px solid
        rgba(255,255,255,.1);

    direction:ltr;
}

.code-head{

    height:37px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 9px;

    background:#0d121c;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.code-lang{

    color:#8090a9;

    font-size:10px;

    direction:ltr;
}

.copy-code{

    border:
        1px solid
        rgba(255,255,255,.1);

    background:#151c29;

    color:#d9e8ff;

    padding:
        6px 10px;

    border-radius:8px;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    font-size:10px;

    cursor:pointer;
}

.code-content{

    margin:0;

    padding:14px;

    overflow-x:auto;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size:12px;

    line-height:1.7;

    color:#e8edf7;

    direction:ltr;

    text-align:left;

    white-space:pre;
}

@media(max-width:600px){

    .bubble{
        max-width:96%;
    }

    .chat{
        padding-left:8px;
        padding-right:8px;
    }

    .welcome{
        margin-top:18vh;
    }

}

</style>

</head>


<body>

<div class="app">


<header class="header">

    <div class="logo">

        <div class="logo-icon">
            🤖
        </div>

        <div>

            <div class="logo-text">
                BEHRAD AI
            </div>

            <div class="logo-sub">
                SPACE BUNNY • WEB • VISION
            </div>

        </div>

    </div>

    <div class="status">
        ● ONLINE
    </div>

</header>


<main
    id="chat"
    class="chat"
>

    <div
        id="welcome"
        class="welcome"
    >

        <div class="welcome-icon">
            🚀
        </div>

        <h1>
            BEHRAD AI
        </h1>

        <p>
            عکس • ویدیو • کدنویسی • وب
        </p>

    </div>

</main>


<div class="composer">


<div
    id="attachPreview"
    class="attach-preview"
>

    <img
        id="attachThumb"
        class="attach-thumb"
        style="display:none"
    >

    <video
        id="attachVideo"
        class="attach-thumb"
        style="display:none"
        muted
    ></video>

    <div class="attach-info">

        <div
            id="attachName"
            class="attach-name"
        >
            فایل
        </div>

        <div
            id="attachType"
            class="attach-type"
        >
            آماده ارسال
        </div>

    </div>

    <button
        id="removeFile"
        class="remove-file"
        type="button"
    >
        ✕
    </button>

</div>


<div class="input-row">


<input
    id="fileInput"
    type="file"
    accept="image/*,video/*"
    hidden
>


<button
    id="attachBtn"
    class="icon-btn"
    type="button"
>
    📎
</button>


<textarea
    id="messageInput"
    class="textbox"
    placeholder="پیامت رو بنویس..."
    rows="1"
></textarea>


<button
    id="sendBtn"
    class="send-btn"
    type="button"
>
    ➤
</button>


</div>

</div>

</div>


<script>

const chat =
    document.getElementById("chat");

const welcome =
    document.getElementById("welcome");

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendBtn =
    document.getElementById(
        "sendBtn"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const attachBtn =
    document.getElementById(
        "attachBtn"
    );

const attachPreview =
    document.getElementById(
        "attachPreview"
    );

const attachThumb =
    document.getElementById(
        "attachThumb"
    );

const attachVideo =
    document.getElementById(
        "attachVideo"
    );

const attachName =
    document.getElementById(
        "attachName"
    );

const attachType =
    document.getElementById(
        "attachType"
    );

const removeFile =
    document.getElementById(
        "removeFile"
    );


let messages = [];

let selectedFile = null;


/* =====================================================
   SAFE RESPONSE
===================================================== */

async function readResponse(
    response
){

    const text =
        await response.text();


    let data = null;


    try{

        data =
            JSON.parse(text);

    }catch(error){

        /*
           اگر Render/Flask به جای JSON
           HTML برگرداند.
        */

        if(
            text.trim()
                .toLowerCase()
                .startsWith("<!doctype") ||
            text.trim()
                .toLowerCase()
                .startsWith("<html")
        ){

            throw new Error(
                "سرور به‌جای JSON یک صفحه HTML برگرداند. احتمالاً endpoint آپلود هنوز روی Render به‌روز نشده یا فایل بیش از حد مجاز است."
            );

        }


        throw new Error(
            text.slice(0,500) ||
            "پاسخ نامعتبر از سرور."
        );

    }


    if(
        !response.ok ||
        data?.success === false
    ){

        throw new Error(
            data?.error ||
            `خطای سرور (${response.status})`
        );

    }


    return data;

}


/* =====================================================
   STORAGE
===================================================== */

function saveMessages(){

    try{

        localStorage.setItem(
            "behrad_ai_messages",
            JSON.stringify(
                messages
            )
        );

    }catch(e){

        console.warn(e);

    }

}


function loadMessages(){

    try{

        const saved =
            localStorage.getItem(
                "behrad_ai_messages"
            );


        if(!saved){
            return;
        }


        messages =
            JSON.parse(saved);


        for(
            const message
            of messages
        ){

            if(
                message.role === "user" ||
                message.role === "assistant"
            ){

                renderMessage(
                    message.role,
                    message.content,
                    message.media
                );

            }

        }


        if(messages.length){

            welcome.style.display =
                "none";

        }

    }catch(e){

        console.warn(e);

    }

}


loadMessages();


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =====================================================
   MARKDOWN
===================================================== */

function renderMarkdown(text){

    if(!text){
        return "";
    }


    let html;


    try{

        html =
            marked.parse(
                text,
                {
                    breaks:true,
                    gfm:true
                }
            );

    }catch(e){

        return `
            <p>
                ${escapeHtml(text)}
            </p>
        `;

    }


    const temp =
        document.createElement(
            "div"
        );


    temp.innerHTML =
        html;


    temp
        .querySelectorAll("pre")
        .forEach(pre => {

            const code =
                pre.querySelector(
                    "code"
                );


            if(!code){
                return;
            }


            const rawCode =
                code.textContent || "";


            let language =
                "CODE";


            const match =
                (
                    code.className || ""
                ).match(
                    /language-([\w+-]+)/
                );


            if(match){

                language =
                    match[1];

            }


            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "code-wrap";


            const head =
                document.createElement(
                    "div"
                );

            head.className =
                "code-head";


            const lang =
                document.createElement(
                    "span"
                );

            lang.className =
                "code-lang";

            lang.textContent =
                language;


            const copy =
                document.createElement(
                    "button"
                );

            copy.className =
                "copy-code";

            copy.type =
                "button";

            copy.textContent =
                "📋 کپی کد";

            copy.dataset.code =
                rawCode;


            head.appendChild(
                lang
            );

            head.appendChild(
                copy
            );


            const content =
                document.createElement(
                    "pre"
                );

            content.className =
                "code-content";

            content.textContent =
                rawCode;


            wrapper.appendChild(
                head
            );

            wrapper.appendChild(
                content
            );


            pre.replaceWith(
                wrapper
            );

        });


    temp
        .querySelectorAll("a")
        .forEach(a => {

            a.target =
                "_blank";

            a.rel =
                "noopener noreferrer";

        });


    return DOMPurify.sanitize(
        temp.innerHTML,
        {
            USE_PROFILES:{
                html:true
            }
        }
    );

}


/* =====================================================
   COPY CODE ONLY
===================================================== */

document.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                ".copy-code"
            );


        if(!button){
            return;
        }


        const code =
            button.dataset.code || "";


        try{

            await navigator
                .clipboard
                .writeText(code);


            const old =
                button.textContent;


            button.textContent =
                "✅ کپی شد";


            setTimeout(
                () => {

                    button.textContent =
                        old;

                },
                1200
            );


        }catch(e){

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                code;


            document.body.appendChild(
                textarea
            );


            textarea.select();


            document.execCommand(
                "copy"
            );


            textarea.remove();


            button.textContent =
                "✅ کپی شد";


            setTimeout(
                () => {

                    button.textContent =
                        "📋 کپی کد";

                },
                1200
            );

        }

    }
);


/* =====================================================
   FILE
===================================================== */

attachBtn.addEventListener(
    "click",
    () => {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    () => {

        const file =
            fileInput.files?.[0];


        if(!file){
            return;
        }


        selectedFile =
            file;


        attachPreview
            .classList
            .add("active");


        attachName.textContent =
            file.name;


        attachType.textContent =
            file.type.startsWith(
                "image/"
            )
            ? "🖼️ تصویر آماده ارسال"
            : "🎬 ویدیو آماده ارسال";


        attachThumb.style.display =
            "none";

        attachVideo.style.display =
            "none";


        const url =
            URL.createObjectURL(
                file
            );


        if(
            file.type.startsWith(
                "image/"
            )
        ){

            attachThumb.src =
                url;

            attachThumb.style.display =
                "block";

        }else{

            attachVideo.src =
                url;

            attachVideo.style.display =
                "block";

        }

    }
);


removeFile.addEventListener(
    "click",
    clearFile
);


function clearFile(){

    selectedFile =
        null;


    fileInput.value =
        "";


    attachPreview
        .classList
        .remove("active");


    attachThumb.src =
        "";

    attachVideo.src =
        "";

}


/* =====================================================
   UPLOAD
===================================================== */

async function uploadFile(
    file
){

    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    attachType.textContent =
        "⏳ در حال آپلود...";


    const response =
        await fetch(
            "/api/upload",
            {
                method:"POST",
                body:formData
            }
        );


    return await readResponse(
        response
    );

}


/* =====================================================
   MEDIA HTML
===================================================== */

function mediaHtml(media){

    if(!media){
        return "";
    }


    if(
        media.type === "image"
    ){

        return `
            <img
                class="preview-image"
                src="${escapeHtml(media.url)}"
                alt="image"
            >
        `;

    }


    if(
        media.type === "video"
    ){

        return `
            <video
                class="preview-video"
                src="${escapeHtml(media.url)}"
                controls
                preload="metadata"
            ></video>
        `;

    }


    return "";

}


/* =====================================================
   RENDER
===================================================== */

function renderMessage(
    role,
    content,
    media = null
){

    const message =
        document.createElement(
            "div"
        );


    message.className =
        role === "user"
        ? "message user"
        : "message ai";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    if(media){

        bubble.innerHTML +=
            mediaHtml(media);

    }


    if(
        role === "user"
    ){

        const text =
            document.createElement(
                "div"
            );


        text.textContent =
            content || "";


        bubble.appendChild(
            text
        );

    }else{

        bubble.innerHTML +=
            renderMarkdown(
                content
            );

    }


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   TYPING
===================================================== */

function showTyping(){

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message ai";


    message.id =
        "typingMessage";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.innerHTML = `
        <div class="typing">

            <span class="dot"></span>

            <span class="dot"></span>

            <span class="dot"></span>

        </div>
    `;


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


function removeTyping(){

    document
        .getElementById(
            "typingMessage"
        )
        ?.remove();

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(
        !text &&
        !selectedFile
    ){

        return;

    }


    sendBtn.disabled =
        true;

    attachBtn.disabled =
        true;

    messageInput.disabled =
        true;


    try{

        let media = null;


        /* -----------------------------------------
           Upload
        ----------------------------------------- */

        if(selectedFile){

            media =
                await uploadFile(
                    selectedFile
                );

        }


        /* -----------------------------------------
           Content
        ----------------------------------------- */

        const content = [];


        if(text){

            content.push({

                type:"text",

                text:text

            });

        }else{

            content.push({

                type:"text",

                text:
                    media?.type === "image"
                    ? "این تصویر را بررسی کن."
                    : "این ویدیو را بررسی کن."

            });

        }


        /* -----------------------------------------
           Image
        ----------------------------------------- */

        if(
            media?.type === "image"
        ){

            content.push({

                type:
                    "image_url",

                image_url:{

                    url:
                        media.url

                }

            });

        }


        /* -----------------------------------------
           Video
        ----------------------------------------- */

        if(
            media?.type === "video"
        ){

            content.push({

                type:
                    "video_url",

                video_url:{

                    url:
                        media.url

                }

            });

        }


        renderMessage(
            "user",
            text,
            media
        );


        messages.push({

            role:"user",

            content:content,

            media:
                media || null

        });


        saveMessages();


        welcome.style.display =
            "none";


        messageInput.value =
            "";


        clearFile();


        showTyping();


        /* -----------------------------------------
           API
        ----------------------------------------- */

        const apiMessages =
            messages.map(
                message => ({

                    role:
                        message.role,

                    content:
                        message.content

                })
            );


        const response =
            await fetch(
                "/api/chat",
                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            messages:
                                apiMessages

                        })

                }
            );


        const data =
            await readResponse(
                response
            );


        const answer =
            data.reply;


        if(!answer){

            throw new Error(
                "پاسخ خالی از سرور دریافت شد."
            );

        }


        removeTyping();


        renderMessage(
            "assistant",
            answer
        );


        messages.push({

            role:
                "assistant",

            content:
                answer

        });


        saveMessages();


    }catch(error){

        removeTyping();


        renderMessage(

            "assistant",

            "❌ " +
            (
                error.message ||
                "خطای ناشناخته"
            )

        );

    }finally{

        sendBtn.disabled =
            false;

        attachBtn.disabled =
            false;

        messageInput.disabled =
            false;

        messageInput.focus();

    }

}


/* =====================================================
   EVENTS
===================================================== */

sendBtn.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   AUTO RESIZE
===================================================== */

messageInput.addEventListener(
    "input",
    () => {

        messageInput.style.height =
            "auto";


        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                140
            ) + "px";

    }
);

</script>

</body>

</html>
