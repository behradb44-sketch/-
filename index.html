<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>BEHRAD AI</title>


<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
        Tahoma,
        Arial,
        sans-serif;

    color:white;

    background:#05070d;

}


body{

    background:

        radial-gradient(
            circle at 100% 0%,
            rgba(0,130,255,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 0% 100%,
            rgba(255,0,80,.18),
            transparent 35%
        ),

        #05070d;

}


.app{

    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

}


.header{

    height:64px;
    min-height:64px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(5,7,13,.9);

    backdrop-filter:blur(20px);

}


.logo{

    display:flex;

    align-items:center;

    gap:9px;

    font-size:18px;

    font-weight:bold;

}


.logo-icon{

    width:38px;
    height:38px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #168cff,
            #ff275f
        );

}


.model{

    font-size:9px;

    color:#7d8798;

}


.model b{

    color:#59a7ff;

}


.chat{

    flex:1;

    overflow-y:auto;

    padding:
        20px
        12px
        115px;

}


.welcome{

    min-height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;

}


.robot{

    font-size:60px;

    margin-bottom:20px;

}


.welcome h1{

    margin:0 0 10px;

    font-size:25px;

}


.welcome p{

    color:#8791a2;

    font-size:13px;

    line-height:2;

}


.message{

    display:flex;

    margin:13px 0;

}


.message.user{

    justify-content:flex-start;

}


.message.ai{

    justify-content:flex-end;

}


.bubble{

    max-width:90%;

    padding:
        12px
        14px;

    border-radius:17px;

    line-height:1.9;

    font-size:14px;

    white-space:pre-wrap;

    overflow-wrap:anywhere;

}


.user .bubble{

    background:
        linear-gradient(
            135deg,
            #087ff5,
            #3157d8
        );

    border-bottom-left-radius:5px;

}


.ai .bubble{

    background:
        rgba(255,255,255,.07);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-bottom-right-radius:5px;

}


.error{

    color:#ff8ca0;

}


.bottom{

    position:fixed;

    bottom:0;

    left:0;
    right:0;

    padding:
        10px
        10px
        calc(
            10px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            to top,
            #05070d 65%,
            transparent
        );

}


.input{

    display:flex;

    align-items:flex-end;

    gap:8px;

    padding:7px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:19px;

    background:
        rgba(15,20,32,.96);

}


textarea{

    flex:1;

    min-width:0;

    height:46px;
    max-height:130px;

    resize:none;

    border:0;

    outline:0;

    background:transparent;

    color:white;

    font-family:inherit;

    font-size:14px;

    padding:11px;

}


textarea::placeholder{

    color:#687386;

}


.send{

    width:46px;
    height:46px;

    border:0;

    border-radius:14px;

    color:white;

    font-size:20px;

    background:
        linear-gradient(
            135deg,
            #168cff,
            #725cff
        );

}


.send:disabled{

    opacity:.4;

}


.loading{

    color:#8993a5;

    font-size:12px;

}


</style>

</head>


<body>


<div class="app">


<header class="header">

<div class="logo">

<div class="logo-icon">
🤖
</div>

BEHRAD AI

</div>


<div class="model">

<span>مدل:</span>

<b>
Space Bunny Alpha
</b>

</div>

</header>


<main
    class="chat"
    id="chat"
>


<div
    class="welcome"
    id="welcome"
>

<div class="robot">
🤖
</div>

<h1>
سلام! 👋
</h1>

<p>
من BEHRAD AI هستم.
</p>

<p>
هر چیزی خواستی بپرس 🚀
</p>

</div>


</main>


<div class="bottom">

<div class="input">


<textarea
    id="input"
    placeholder="پیامت رو بنویس..."
    rows="1"
></textarea>


<button
    class="send"
    id="send"
    type="button"
>

➤

</button>


</div>

</div>


</div>


<script>


const chat =
    document.getElementById(
        "chat"
    );


const welcome =
    document.getElementById(
        "welcome"
    );


const input =
    document.getElementById(
        "input"
    );


const send =
    document.getElementById(
        "send"
    );


let messages = [];

let busy = false;


/* ==========================
   STORAGE
========================== */


function save(){

    try{

        localStorage.setItem(

            "BEHRAD_AI_CHAT",

            JSON.stringify(
                messages
            )

        );

    }
    catch(error){

        console.error(
            "Storage error:",
            error
        );

    }

}


function load(){

    try{

        const saved =
            localStorage.getItem(
                "BEHRAD_AI_CHAT"
            );


        if(!saved)
            return;


        const parsed =
            JSON.parse(
                saved
            );


        if(!Array.isArray(parsed))
            return;


        messages =
            parsed;


        messages.forEach(
            msg => {

                if(
                    msg &&
                    msg.role &&
                    typeof msg.content === "string"
                ){

                    addMessage(

                        msg.role,

                        msg.content

                    );

                }

            }
        );


        if(messages.length){

            welcome.style.display =
                "none";

        }

    }
    catch(error){

        console.error(
            "Load error:",
            error
        );

    }

}


/* ==========================
   ADD MESSAGE
========================== */


function addMessage(
    role,
    text
){

    welcome.style.display =
        "none";


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        (
            role === "user"
            ? "user"
            : "ai"
        );


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    wrapper.appendChild(
        bubble
    );


    chat.appendChild(
        wrapper
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* ==========================
   LOADING
========================== */


function addLoading(){

    removeLoading();


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.id =
        "loading";


    wrapper.className =
        "message ai";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble loading";


    bubble.textContent =
        "BEHRAD AI در حال فکر کردنه... 🤔";


    wrapper.appendChild(
        bubble
    );


    chat.appendChild(
        wrapper
    );


    chat.scrollTop =
        chat.scrollHeight;

}


function removeLoading(){

    const loading =
        document.getElementById(
            "loading"
        );


    if(loading){

        loading.remove();

    }

}


/* ==========================
   GET ERROR MESSAGE
========================== */


function getServerError(
    data,
    response
){

    if(data){

        if(
            typeof data.error ===
            "string"
        ){

            return data.error;

        }


        if(
            data.details &&
            data.details.error &&
            data.details.error.message
        ){

            return data.details.error.message;

        }


        if(
            data.details &&
            typeof data.details ===
            "string"
        ){

            return data.details;

        }

    }


    return (
        "خطای سرور (" +
        response.status +
        ")"
    );

}


/* ==========================
   SEND
========================== */


async function sendMessage(){

    if(busy)
        return;


    const text =
        input.value.trim();


    if(!text)
        return;


    busy = true;

    send.disabled =
        true;


    input.value =
        "";

    input.style.height =
        "46px";


    addMessage(
        "user",
        text
    );


    messages.push({

        role:
            "user",

        content:
            text

    });


    save();


    addLoading();


    try{

        const response =
            await fetch(
                "/api/chat",
                {

                    method:
                        "POST",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            messages:
                                messages

                        })

                }
            );


        let data;


        try{

            data =
                await response.json();

        }
        catch(jsonError){

            throw new Error(
                "سرور پاسخ JSON معتبر ارسال نکرد."
            );

        }


        console.log(
            "BEHRAD AI SERVER RESPONSE:",
            data
        );


        if(!response.ok){

            throw new Error(

                getServerError(
                    data,
                    response
                )

            );

        }


        /*
         * server.py returns:
         *
         * {
         *   success: true,
         *   reply: "..."
         * }
         *
         * So we must read data.reply
         */

        const answer =
            data?.reply;


        if(
            !answer ||
            typeof answer !==
            "string" ||
            !answer.trim()
        ){

            throw new Error(
                "پاسخ خالی از سرور دریافت شد."
            );

        }


        removeLoading();


        addMessage(
            "assistant",
            answer
        );


        messages.push({

            role:
                "assistant",

            content:
                answer

        });


        save();


    }
    catch(error){

        removeLoading();


        const errorText =
            error instanceof Error
            ? error.message
            : String(error);


        addMessage(

            "assistant",

            "❌ خطا:\n\n" +
            errorText

        );


        console.error(
            "BEHRAD AI ERROR:",
            error

        );

    }
    finally{

        busy = false;

        send.disabled =
            false;

        input.focus();

    }

}


/* ==========================
   BUTTON
========================== */


send.addEventListener(

    "click",

    sendMessage

);


/* ==========================
   ENTER
========================== */


input.addEventListener(

    "keydown",

    function(event){

        if(

            event.key === "Enter"

            &&

            !event.shiftKey

        ){

            event.preventDefault();

            sendMessage();

        }

    }

);


/* ==========================
   AUTO HEIGHT
========================== */


input.addEventListener(

    "input",

    function(){

        this.style.height =
            "46px";


        this.style.height =
            Math.min(
                this.scrollHeight,
                130
            ) + "px";

    }

);


/* ==========================
   START
========================== */


load();

input.focus();


</script>


</body>

</html>
