<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Content-Type"
        content="text/html; charset=UTF-8"
    >

    <title>BEHRAD AI</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #212121;
            color: #ececec;

            font-family:
                Tahoma,
                Arial,
                sans-serif;
        }

        body {
            overflow: hidden;
        }

        button,
        textarea,
        input {
            font-family: inherit;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            display: flex;

            width: 100%;
            height: 100vh;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 260px;

            flex-shrink: 0;

            background: #171717;

            border-left:
                1px solid
                #303030;

            padding: 12px;

            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                12px
                10px
                18px;

            font-size: 18px;

            font-weight: bold;
        }

        .brand-logo {
            width: 34px;
            height: 34px;

            border-radius: 10px;

            background: #10a37f;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            font-weight: bold;
        }

        .new-chat {
            width: 100%;

            padding: 11px;

            border:
                1px solid
                #444;

            border-radius: 8px;

            background: #212121;

            color: #eee;

            cursor: pointer;

            text-align: right;

            transition: .2s;
        }

        .new-chat:hover {
            background: #2b2b2b;
        }

        .history-title {
            color: #777;

            font-size: 12px;

            margin:
                24px
                8px
                8px;
        }

        .history {
            flex: 1;

            overflow-y: auto;
        }

        .history-item {
            padding: 10px;

            border-radius: 7px;

            color: #ccc;

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            cursor: pointer;
        }

        .history-item:hover {
            background: #2a2a2a;
        }

        .sidebar-footer {
            color: #666;

            font-size: 11px;

            text-align: center;

            padding-top: 10px;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

            background: #212121;
        }

        .topbar {
            height: 58px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0
                22px;

            border-bottom:
                1px solid
                #303030;
        }

        .model-name {
            font-size: 14px;

            font-weight: bold;
        }

        .model-status {
            color: #777;

            font-size: 11px;

            margin-right: 7px;
        }

        .online-dot {
            display: inline-block;

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #10a37f;

            margin-left: 5px;
        }

        /* =====================================================
           CHAT
        ===================================================== */

        .chat {
            flex: 1;

            overflow-y: auto;

            scroll-behavior: smooth;
        }

        .chat-inner {
            width:
                min(
                    900px,
                    calc(100% - 32px)
                );

            margin: 0 auto;

            padding:
                30px
                0
                170px;
        }

        .welcome {
            min-height: 55vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }

        .welcome-logo {
            width: 62px;
            height: 62px;

            border-radius: 18px;

            background: #10a37f;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 20px;
        }

        .welcome h1 {
            margin:
                0
                0
                10px;

            font-size: 28px;
        }

        .welcome p {
            margin: 0;

            color: #999;

            font-size: 14px;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            display: flex;

            gap: 15px;

            margin-bottom: 28px;

            line-height: 1.9;
        }

        .message-avatar {
            width: 34px;
            height: 34px;

            min-width: 34px;

            border-radius: 9px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 11px;

            font-weight: bold;
        }

        .message.user .message-avatar {
            background: #444;
        }

        .message.assistant .message-avatar {
            background: #10a37f;
        }

        .message-body {
            width: 100%;

            min-width: 0;

            font-size: 15px;
        }

        /* =====================================================
           MARKDOWN
        ===================================================== */

        .message-body pre {
            position: relative;

            direction: ltr;

            text-align: left;

            background: #111;

            border:
                1px solid
                #333;

            border-radius: 9px;

            padding:
                42px
                14px
                14px;

            overflow-x: auto;
        }

        .message-body code {
            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 13px;
        }

        .message-body :not(pre) > code {
            background: #303030;

            border-radius: 5px;

            padding:
                2px
                6px;
        }

        .message-body a {
            color: #5db3ff;
        }

        .message-body blockquote {
            border-right:
                3px solid
                #10a37f;

            padding-right: 12px;

            color: #aaa;
        }

        .message-body table {
            width: 100%;

            border-collapse: collapse;

            margin: 15px 0;
        }

        .message-body th,
        .message-body td {
            border:
                1px solid
                #444;

            padding: 8px;
        }

        .message-body th {
            background: #2b2b2b;
        }

        /* =====================================================
           COPY
        ===================================================== */

        .code-copy {
            position: absolute;

            top: 8px;

            left: 8px;

            border:
                1px solid
                #444;

            background: #242424;

            color: #ddd;

            border-radius: 6px;

            padding:
                5px
                9px;

            cursor: pointer;

            font-size: 11px;
        }

        .code-copy:hover {
            background: #333;
        }

        /* =====================================================
           THINKING
        ===================================================== */

        .thinking {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .thinking-text {
            color: #999;

            font-size: 13px;
        }

        .wave {
            display: flex;

            align-items: center;

            gap: 3px;

            height: 22px;
        }

        .wave span {
            width: 3px;

            height: 7px;

            border-radius: 4px;

            background: #10a37f;

            animation:
                wave
                1s
                infinite
                ease-in-out;
        }

        .wave span:nth-child(2) {
            animation-delay: .1s;
        }

        .wave span:nth-child(3) {
            animation-delay: .2s;
        }

        .wave span:nth-child(4) {
            animation-delay: .3s;
        }

        .wave span:nth-child(5) {
            animation-delay: .4s;
        }

        @keyframes wave {

            0%,
            100% {
                height: 7px;
            }

            50% {
                height: 20px;
            }
        }

        /* =====================================================
           SEARCH
        ===================================================== */

        .search-status {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding:
                7px
                10px;

            margin-bottom: 10px;

            border:
                1px solid
                #3b3b3b;

            border-radius: 8px;

            background: #292929;

            color: #bbb;

            font-size: 12px;
        }

        .search-icon {
            animation:
                pulse
                1s
                infinite;
        }

        @keyframes pulse {

            0% {
                opacity: .4;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: .4;
            }
        }

        /* =====================================================
           COMPOSER
        ===================================================== */

        .composer-area {
            position: fixed;

            bottom: 0;

            left: 0;

            right: 260px;

            padding:
                15px
                20px
                20px;

            background:
                linear-gradient(
                    to top,
                    #212121 70%,
                    transparent
                );
        }

        .composer {
            width:
                min(
                    900px,
                    calc(100% - 32px)
                );

            margin: 0 auto;

            padding: 8px;

            border:
                1px solid
                #444;

            border-radius: 14px;

            background: #2f2f2f;
        }

        .composer-row {
            display: flex;

            align-items: flex-end;

            gap: 8px;
        }

        #input {
            flex: 1;

            min-height: 38px;

            max-height: 180px;

            resize: none;

            border: 0;

            outline: 0;

            background: transparent;

            color: #eee;

            font-size: 14px;

            line-height: 1.7;

            padding:
                8px
                5px;
        }

        #input::placeholder {
            color: #777;
        }

        .attach-button,
        .send-button {
            width: 38px;

            height: 38px;

            min-width: 38px;

            border: 0;

            border-radius: 9px;

            cursor: pointer;
        }

        .attach-button {
            background: #444;

            color: #ddd;

            font-size: 19px;
        }

        .send-button {
            background: #10a37f;

            color: white;

            font-size: 17px;
        }

        .send-button:disabled {
            opacity: .5;

            cursor: not-allowed;
        }

        .attachment-preview {
            display: none;

            align-items: center;

            justify-content: space-between;

            padding:
                8px
                10px;

            margin-bottom: 7px;

            background: #242424;

            border-radius: 8px;

            color: #bbb;

            font-size: 12px;
        }

        .attachment-preview.active {
            display: flex;
        }

        .remove-file {
            border: 0;

            background: transparent;

            color: #999;

            cursor: pointer;

            font-size: 18px;
        }

        .composer-note {
            color: #666;

            font-size: 10px;

            text-align: center;

            padding-top: 7px;
        }

        #fileInput {
            display: none;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 750px) {

            .sidebar {
                display: none;
            }

            .composer-area {
                right: 0;
            }

            .chat-inner {
                width:
                    calc(100% - 20px);

                padding-top: 20px;
            }

            .composer {
                width:
                    calc(100% - 4px);
            }

            .topbar {
                padding:
                    0
                    14px;
            }

            .welcome h1 {
                font-size: 23px;
            }

            .message-body {
                font-size: 14px;
            }
        }

    </style>

</head>


<body>

<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-logo">
                B
            </div>

            <span>
                BEHRAD AI
            </span>

        </div>


        <button
            class="new-chat"
            id="newChatButton"
            type="button"
        >
            ＋ گفتگوی جدید
        </button>


        <div class="history-title">
            تاریخچه
        </div>


        <div
            class="history"
            id="history"
        ></div>


        <div class="sidebar-footer">
            BEHRAD M PLAYER
        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <header class="topbar">

            <div>

                <span class="online-dot"></span>

                <span class="model-name">
                    Space Bunny Alpha
                </span>

                <span class="model-status">
                    آنلاین
                </span>

            </div>

            <div>
                BEHRAD AI
            </div>

        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        B
                    </div>

                    <h1>
                        سلام، من BEHRAD AI هستم 👋
                    </h1>

                    <p>
                        چه کاری برات انجام بدم؟
                    </p>

                </div>

            </div>

        </section>


        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer-area">

            <div class="composer">


                <div
                    class="attachment-preview"
                    id="attachmentPreview"
                >

                    <span
                        id="attachmentName"
                    >
                        فایل انتخاب شد
                    </span>

                    <button
                        class="remove-file"
                        id="removeFile"
                        type="button"
                    >
                        ×
                    </button>

                </div>


                <div class="composer-row">


                    <button
                        class="attach-button"
                        id="attachButton"
                        type="button"
                        title="آپلود عکس یا ویدئو"
                    >
                        ＋
                    </button>


                    <textarea
                        id="input"
                        rows="1"
                        placeholder="پیامت رو بنویس..."
                    ></textarea>


                    <button
                        class="send-button"
                        id="sendButton"
                        type="button"
                        title="ارسال"
                    >
                        ➤
                    </button>


                </div>


                <div class="composer-note">
                    BEHRAD AI ممکن است اشتباه کند؛ اطلاعات مهم را بررسی کن.
                </div>


            </div>

        </div>


        <input
            id="fileInput"
            type="file"
            accept="image/*,video/*"
        >

    </main>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const STORAGE_KEY =
    "behrad_ai_utf8_v1";

const MAX_HISTORY =
    12;


/* =========================================================
   DOM
========================================================= */

const input =
    document.getElementById(
        "input"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const attachButton =
    document.getElementById(
        "attachButton"
    );

const fileInput =
    document.getElementById(
        "fileInput"
    );

const removeFile =
    document.getElementById(
        "removeFile"
    );

const attachmentPreview =
    document.getElementById(
        "attachmentPreview"
    );

const attachmentName =
    document.getElementById(
        "attachmentName"
    );

const chat =
    document.getElementById(
        "chat"
    );

const chatInner =
    document.getElementById(
        "chatInner"
    );

const history =
    document.getElementById(
        "history"
    );

const welcome =
    document.getElementById(
        "welcome"
    );

const newChatButton =
    document.getElementById(
        "newChatButton"
    );


/* =========================================================
   STATE
========================================================= */

let messages = [];

let selectedFile = null;

let isSending = false;


/* =========================================================
   MARKED
========================================================= */

if (window.marked) {

    marked.setOptions({
        breaks: true,
        gfm: true
    });

}


/* =========================================================
   LOAD
========================================================= */

function loadMessages() {

    try {

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!saved) {
            return [];
        }

        const parsed =
            JSON.parse(saved);

        if (!Array.isArray(parsed)) {
            return [];
        }

        return parsed
            .filter(
                message =>
                    message &&
                    (
                        message.role === "user" ||
                        message.role === "assistant"
                    )
            )
            .slice(
                -MAX_HISTORY
            );

    } catch {

        return [];

    }

}


/* =========================================================
   SAVE
========================================================= */

function saveMessages() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                messages.slice(
                    -MAX_HISTORY
                )
            )
        );

    } catch {

        console.warn(
            "Could not save history."
        );

    }

}


/* =========================================================
   FILE
========================================================= */

function clearFile() {

    selectedFile =
        null;

    fileInput.value =
        "";

    attachmentPreview
        .classList
        .remove("active");

}


function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                () => reject(
                    new Error(
                        "خواندن فایل ناموفق بود."
                    )
                );

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================================
   MARKDOWN
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


function renderMarkdown(text) {

    if (!text) {
        return "";
    }

    if (
        !window.marked ||
        !window.DOMPurify
    ) {

        return escapeHTML(
            text
        ).replace(
            /\n/g,
            "<br>"
        );

    }

    return DOMPurify.sanitize(
        marked.parse(
            text
        )
    );

}


/* =========================================================
   COPY CODE
========================================================= */

function addCopyButtons(
    container
) {

    const blocks =
        container.querySelectorAll(
            "pre"
        );

    blocks.forEach(
        pre => {

            if (
                pre.querySelector(
                    ".code-copy"
                )
            ) {
                return;
            }

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "code-copy";

            button.type =
                "button";

            button.textContent =
                "کپی کد";

            button.onclick =
                async () => {

                    const code =
                        pre.querySelector(
                            "code"
                        );

                    if (!code) {
                        return;
                    }

                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                code.innerText
                            );

                        button.textContent =
                            "کپی شد ✓";

                        setTimeout(
                            () => {
                                button.textContent =
                                    "کپی کد";
                            },
                            1500
                        );

                    } catch {

                        button.textContent =
                            "کپی نشد";

                    }

                };

            pre.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   RENDER MESSAGE
========================================================= */

function renderMessage(
    message
) {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message " +
        message.role;


    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "message-avatar";

    avatar.textContent =
        message.role === "user"
            ? "شما"
            : "AI";


    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";


    if (
        message.role ===
        "assistant"
    ) {

        body.innerHTML =
            renderMarkdown(
                message.content || ""
            );

        addCopyButtons(
            body
        );

    } else {

        body.textContent =
            typeof message.content === "string"
                ? message.content
                : "📎 فایل پیوست شد.";

    }


    row.appendChild(
        avatar
    );

    row.appendChild(
        body
    );

    chatInner.appendChild(
        row
    );


    return {
        row: row,
        content: body
    };

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll() {

    chatInner.innerHTML =
        "";

    if (!messages.length) {

        chatInner.appendChild(
            welcome
        );

        welcome.style.display =
            "flex";

        return;

    }

    welcome.style.display =
        "none";


    messages.forEach(
        message => {

            renderMessage(
                message
            );

        }
    );


    scrollBottom();

}


/* =========================================================
   HISTORY
========================================================= */

function renderHistory() {

    history.innerHTML =
        "";

    messages
        .filter(
            message =>
                message.role ===
                "user"
        )
        .slice()
        .reverse()
        .slice(
            0,
            20
        )
        .forEach(
            message => {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "history-item";

                let title =
                    typeof message.content === "string"
                        ? message.content
                        : "📎 فایل";

                title =
                    title
                        .replace(
                            /\n/g,
                            " "
                        )
                        .trim();

                if (!title) {
                    title =
                        "گفتگوی جدید";
                }

                item.textContent =
                    title.slice(
                        0,
                        50
                    );

                history.appendChild(
                    item
                );

            }
        );

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom() {

    requestAnimationFrame(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* =========================================================
   THINKING
========================================================= */

function createThinkingRow() {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message assistant";


    row.innerHTML = `

        <div class="message-avatar">
            AI
        </div>

        <div class="message-body">

            <div class="thinking">

                <div class="wave">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

                <div class="thinking-text">
                    در حال فکر کردن...
                </div>

            </div>

        </div>

    `;


    chatInner.appendChild(
        row
    );

    scrollBottom();

    return row;

}


/* =========================================================
   SEARCH STATUS
========================================================= */

function createSearchStatus(
    output
) {

    let box =
        output.querySelector(
            ".search-status"
        );


    if (!box) {

        box =
            document.createElement(
                "div"
            );

        box.className =
            "search-status";


        box.innerHTML = `

            <span class="search-icon">
                🔎
            </span>

            <span>
                در حال جستجو در وب...
            </span>

        `;


        output.prepend(
            box
        );

    }


    return box;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

    if (isSending) {
        return;
    }


    const text =
        input.value.trim();


    if (
        !text &&
        !selectedFile
    ) {

        return;

    }


    isSending =
        true;

    sendButton.disabled =
        true;


    welcome.style.display =
        "none";


    /* =====================================================
       USER CONTENT
    ===================================================== */

    let apiContent =
        text;

    let displayContent =
        text;


    /* =====================================================
       IMAGE
    ===================================================== */

    if (
        selectedFile &&
        selectedFile.type.startsWith(
            "image/"
        )
    ) {

        try {

            const dataURL =
                await fileToDataURL(
                    selectedFile
                );


            apiContent = [

                {
                    type: "text",

                    text:
                        text ||
                        "این تصویر را بررسی کن."
                },

                {
                    type: "image_url",

                    image_url: {
                        url: dataURL
                    }

                }

            ];


            displayContent =
                text
                    ? text +
                      "\n\n🖼️ " +
                      selectedFile.name
                    : "🖼️ " +
                      selectedFile.name;

        } catch {

            isSending =
                false;

            sendButton.disabled =
                false;

            alert(
                "خواندن تصویر ناموفق بود."
            );

            return;

        }

    }


    /* =====================================================
       VIDEO
    ===================================================== */

    else if (
        selectedFile &&
        selectedFile.type.startsWith(
            "video/"
        )
    ) {

        const videoText =
            "[ویدئو پیوست شد: " +
            selectedFile.name +
            "]";


        apiContent =
            text
                ? text +
                  "\n\n" +
                  videoText
                : videoText;


        displayContent =
            text
                ? text +
                  "\n\n🎥 " +
                  selectedFile.name
                : "🎥 " +
                  selectedFile.name;

    }


    /* =====================================================
       SHOW USER MESSAGE IMMEDIATELY
    ===================================================== */

    const userMessage = {

        role: "user",

        content:
            displayContent

    };


    messages.push(
        userMessage
    );


    renderMessage(
        userMessage
    );


    renderHistory();

    scrollBottom();


    input.value =
        "";

    input.style.height =
        "auto";


    clearFile();


    /* =====================================================
       THINKING
    ===================================================== */

    const thinking =
        createThinkingRow();


    try {

        /* ================================================
           BUILD API HISTORY
        ================================================ */

        const apiMessages =
            messages
                .slice(
                    -MAX_HISTORY
                )
                .map(
                    (message, index, array) => {

                        /*
                         * آخرین پیام را با نسخه‌ی API
                         * جایگزین می‌کنیم.
                         */

                        if (
                            index ===
                            array.length - 1
                            &&
                            message.role ===
                            "user"
                        ) {

                            return {

                                role: "user",

                                content:
                                    apiContent

                            };

                        }


                        return {

                            role:
                                message.role,

                            content:
                                message.content

                        };

                    }
                );


        /* ================================================
           REQUEST
        ================================================ */

        const response =
            await fetch(
                "/api/chat/stream",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "text/event-stream"

                    },

                    body:
                        JSON.stringify({
                            messages:
                                apiMessages
                        })

                }
            );


        if (!response.ok) {

            const raw =
                await response.text();

            let message =
                "سرور خطا داد: " +
                response.status +
                " HTTP";


            try {

                const data =
                    JSON.parse(
                        raw
                    );

                if (data.error) {

                    message =
                        data.error;

                }

            } catch {

                if (
                    raw &&
                    raw.length < 1000
                ) {

                    message =
                        raw;

                }

            }


            throw new Error(
                message
            );

        }


        if (!response.body) {

            throw new Error(
                "Streaming در مرورگر در دسترس نیست."
            );

        }


        /* ================================================
           REMOVE THINKING
        ================================================ */

        thinking.remove();


        /* ================================================
           ASSISTANT
        ================================================ */

        const assistantMessage = {

            role: "assistant",

            content: ""

        };


        const assistantUI =
            renderMessage(
                assistantMessage
            );


        const output =
            assistantUI.content;


        let fullText =
            "";

        let buffer =
            "";

        let searchBox =
            null;


        /* ================================================
           STREAM READER
        ================================================ */

        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder(
                "utf-8"
            );


        while (true) {

            const {
                value,
                done
            } =
                await reader.read();


            if (done) {
                break;
            }


            buffer +=
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            buffer =
                buffer.replace(
                    /\r\n/g,
                    "\n"
                );


            const events =
                buffer.split(
                    "\n\n"
                );


            buffer =
                events.pop() || "";


            for (
                const event
                of events
            ) {

                const lines =
                    event.split(
                        "\n"
                    );


                for (
                    const line
                    of lines
                ) {

                    if (
                        !line.startsWith(
                            "data:"
                        )
                    ) {

                        continue;

                    }


                    const raw =
                        line
                            .slice(5)
                            .trim();


                    if (!raw) {
                        continue;
                    }


                    if (
                        raw === "[DONE]"
                    ) {

                        continue;

                    }


                    let data;


                    try {

                        data =
                            JSON.parse(
                                raw
                            );

                    } catch {

                        continue;

                    }


                    /* =====================================
                       SEARCH
                    ===================================== */

                    if (
                        data.type ===
                        "search"
                    ) {

                        searchBox =
                            createSearchStatus(
                                output
                            );


                        const label =
                            searchBox.querySelector(
                                "span:last-child"
                            );


                        let query =
                            "در حال جستجو در وب...";


                        if (
                            data.arguments
                        ) {

                            try {

                                const args =
                                    typeof data.arguments ===
                                    "string"

                                        ? JSON.parse(
                                            data.arguments
                                        )

                                        : data.arguments;


                                if (
                                    args &&
                                    args.query
                                ) {

                                    query =
                                        "در حال جستجو برای «" +
                                        args.query +
                                        "»...";

                                }

                            } catch {

                                // arguments ممکن است
                                // تکه‌تکه دریافت شود

                            }

                        }


                        if (label) {

                            label.textContent =
                                query;

                        }


                        scrollBottom();

                    }


                    /* =====================================
                       REASONING
                    ===================================== */

                    else if (
                        data.type ===
                        "reasoning"
                    ) {

                        scrollBottom();

                    }


                    /* =====================================
                       CONTENT
                    ===================================== */

                    else if (
                        data.type ===
                        "content"
                    ) {

                        if (searchBox) {

                            searchBox.remove();

                            searchBox =
                                null;

                        }


                        fullText +=
                            data.text || "";


                        assistantMessage.content =
                            fullText;


                        output.innerHTML =
                            renderMarkdown(
                                fullText
                            );


                        addCopyButtons(
                            output
                        );


                        scrollBottom();

                    }


                    /* =====================================
                       ERROR
                    ===================================== */

                    else if (
                        data.type ===
                        "error"
                    ) {

                        throw new Error(
                            data.message ||
                            "خطای Streaming"
                        );

                    }

                }

            }

        }


        /* ================================================
           FINAL
        ================================================ */

        if (
            !fullText.trim()
        ) {

            fullText =
                "مدل پاسخ متنی برنگرداند.";

            output.textContent =
                fullText;

        }


        messages.push({

            role: "assistant",

            content:
                fullText

        });


        saveMessages();

        renderHistory();

        scrollBottom();


    } catch (error) {

        console.error(
            "BEHRAD AI ERROR:",
            error
        );


        if (
            thinking &&
            thinking.parentNode
        ) {

            thinking.remove();

        }


        const errorMessage = {

            role: "assistant",

            content:
                "❌ " +
                (
                    error.message ||
                    "خطای ناشناخته"
                )

        };


        renderMessage(
            errorMessage
        );


        scrollBottom();

    } finally {

        isSending =
            false;

        sendButton.disabled =
            false;

        input.focus();

    }

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

    if (isSending) {
        return;
    }


    messages =
        [];

    saveMessages();

    clearFile();

    input.value =
        "";

    input.style.height =
        "auto";

    renderAll();

    renderHistory();

    input.focus();

}


/* =========================================================
   INPUT AUTO RESIZE
========================================================= */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                180
            ) +
            "px";

    }
);


/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   SEND
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ATTACH
========================================================= */

attachButton.addEventListener(
    "click",
    () => {

        if (isSending) {
            return;
        }

        fileInput.click();

    }
);


/* =========================================================
   FILE SELECT
========================================================= */

fileInput.addEventListener(
    "change",
    () => {

        const file =
            fileInput.files &&
            fileInput.files[0];


        if (!file) {
            return;
        }


        selectedFile =
            file;


        attachmentName.textContent =
            "📎 " +
            file.name;


        attachmentPreview
            .classList
            .add("active");

    }
);


/* =========================================================
   REMOVE FILE
========================================================= */

removeFile.addEventListener(
    "click",
    clearFile
);


/* =========================================================
   NEW CHAT
========================================================= */

newChatButton.addEventListener(
    "click",
    newChat
);


/* =========================================================
   START
========================================================= */

messages =
    loadMessages();

renderAll();

renderHistory();

input.focus();

</script>

</body>
</html>
