<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#212121"
>

<title>BEHRAD AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #212121;
    color: #ececec;
    font-family: Tahoma, Arial, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    height: 58px;
    min-height: 58px;
    background: #212121;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: bold;
    font-size: 16px;
}

.logo-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ef4444, #60a5fa);
    color: white;
    font-size: 15px;
    box-shadow: 0 0 15px rgba(96, 165, 250, .2);
}

.model-name {
    color: #9b9b9b;
    font-size: 12px;
}

/* =========================================================
   CHAT
========================================================= */

.chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: auto;
}

.chat-inner {
    width: min(900px, 100%);
    margin: 0 auto;
    padding: 24px 16px 150px;
}

/* =========================================================
   MESSAGE
========================================================= */

.message {
    width: 100%;
    display: flex;
    margin: 18px 0;
}

.message.user {
    justify-content: flex-start;
}

.message.assistant {
    justify-content: flex-end;
}

.message-content {
    max-width: min(88%, 800px);
    line-height: 1.85;
    font-size: 15px;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.message.user .message-content {
    background: #2f2f2f;
    border-radius: 18px 18px 4px 18px;
    padding: 10px 15px;
    color: #f1f1f1;
}

.message.assistant .message-content {
    padding: 3px 4px;
}

/* =========================================================
   MARKDOWN
========================================================= */

.message-content p {
    margin: 0 0 12px;
}

.message-content p:last-child {
    margin-bottom: 0;
}

.message-content h1,
.message-content h2,
.message-content h3 {
    margin: 20px 0 10px;
}

.message-content ul,
.message-content ol {
    padding-right: 25px;
}

.message-content a {
    color: #7db7ff;
}

.message-content blockquote {
    border-right: 3px solid #555;
    margin: 12px 0;
    padding: 5px 12px;
    color: #aaa;
}

.message-content pre {
    direction: ltr;
    text-align: left;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 14px;
    overflow-x: auto;
    max-width: 100%;
    margin: 14px 0;
}

.message-content code {
    font-family: Consolas, Monaco, monospace;
}

.message-content :not(pre) > code {
    background: #303030;
    padding: 2px 5px;
    border-radius: 5px;
}

/* =========================================================
   CODE HEADER
========================================================= */

.code-wrapper {
    position: relative;
    direction: ltr;
}

.copy-code {
    position: absolute;
    top: 7px;
    right: 7px;
    border: 1px solid #444;
    background: #222;
    color: #ddd;
    border-radius: 7px;
    padding: 5px 9px;
    cursor: pointer;
    font-size: 11px;
    z-index: 2;
}

.copy-code:hover {
    background: #333;
}

/* =========================================================
   THINKING
========================================================= */

.thinking {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 7px 2px;
}

.thinking span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #aaa;
    animation: wave 1.2s infinite ease-in-out;
}

.thinking span:nth-child(2) {
    animation-delay: .15s;
}

.thinking span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes wave {
    0%, 60%, 100% {
        transform: translateY(0);
        opacity: .35;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}

/* =========================================================
   INPUT AREA
========================================================= */

.input-area {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(
        to top,
        #212121 75%,
        rgba(33, 33, 33, 0)
    );
    padding: 18px 14px calc(14px + env(safe-area-inset-bottom));
    z-index: 20;
}

.input-box {
    width: min(900px, 100%);
    margin: auto;
    background: #2f2f2f;
    border: 1px solid #454545;
    border-radius: 22px;
    min-height: 58px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px;
    box-shadow: 0 8px 35px rgba(0, 0, 0, .25);
}

textarea {
    flex: 1;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: #eee;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 40px;
    max-height: 190px;
    padding: 8px 5px;
}

textarea::placeholder {
    color: #888;
}

.icon-button {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    flex-shrink: 0;
}

.icon-button:hover {
    background: #3b3b3b;
    color: white;
}

.send-button {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: #eee;
    color: #222;
    cursor: pointer;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.send-button:hover {
    background: white;
    transform: scale(1.03);
}

.send-button:disabled {
    opacity: .35;
    cursor: default;
    transform: none;
}

/* =========================================================
   ATTACHMENT
========================================================= */

#fileInput {
    display: none;
}

.attachment-preview {
    width: min(900px, 100%);
    margin: 0 auto 7px;
    display: none;
}

.attachment-card {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #2f2f2f;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 8px 11px;
    color: #ddd;
    font-size: 12px;
}

.remove-file {
    cursor: pointer;
    color: #aaa;
}

/* =========================================================
   LARGE RESPONSE OPTIMIZATION
========================================================= */

.streaming-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .header {
        padding: 0 11px;
    }

    .chat-inner {
        padding-left: 11px;
        padding-right: 11px;
        padding-top: 15px;
        padding-bottom: 135px;
    }

    .message-content {
        max-width: 94%;
        font-size: 14px;
    }

    .input-area {
        padding-left: 8px;
        padding-right: 8px;
    }

    .input-box {
        border-radius: 19px;
    }

    .model-name {
        display: none;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div class="logo">
        <div class="logo-mark">✦</div>
        <div>BEHRAD AI</div>
    </div>

    <div class="model-name">
        Qwen3.8 27B • Free
    </div>

</header>


<!-- =======================================================
     CHAT
======================================================= -->

<main
    id="chat"
    class="chat"
>

    <div
        id="chatInner"
        class="chat-inner"
    ></div>

</main>


<!-- =======================================================
     INPUT
======================================================= -->

<div class="input-area">

    <div
        id="attachmentPreview"
        class="attachment-preview"
    >
        <div class="attachment-card">
            <span id="attachmentName"></span>
            <span
                id="removeFile"
                class="remove-file"
            >✕</span>
        </div>
    </div>

    <div class="input-box">

        <button
            id="attachButton"
            class="icon-button"
            type="button"
            title="پیوست فایل"
        >
            ＋
        </button>

        <input
            id="fileInput"
            type="file"
            accept="image/*,video/*"
        >

        <textarea
            id="messageInput"
            rows="1"
            placeholder="پیامت را بنویس..."
        ></textarea>

        <button
            id="sendButton"
            class="send-button"
            type="button"
            title="ارسال"
        >
            ↑
        </button>

    </div>

</div>


<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const API_BASE_URL =
    "https://k6k83zh1yv.onrender.com";

const CHAT_API_URL =
    API_BASE_URL + "/api/chat";

const TEST_API_URL =
    API_BASE_URL + "/api/test-ai";

const STORAGE_KEY =
    "behrad_ai_stream_v1";


/* =========================================================
   ELEMENTS
========================================================= */

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const attachButton =
    document.getElementById("attachButton");

const fileInput =
    document.getElementById("fileInput");

const attachmentPreview =
    document.getElementById("attachmentPreview");

const attachmentName =
    document.getElementById("attachmentName");

const removeFile =
    document.getElementById("removeFile");


/* =========================================================
   STATE
========================================================= */

let waiting = false;
let selectedFile = null;


/*
    برای پاسخ‌های خیلی بزرگ:
    متن کامل پاسخ فقط یک بار در این متغیر جمع می‌شود.

    هنگام streaming، Markdown را هر چند کاراکتر
    دوباره parse نمی‌کنیم.
*/
let currentStreamText = "";


/* =========================================================
   STORAGE
========================================================= */

function loadHistory() {

    try {

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if (!raw) {
            return [];
        }

        const data =
            JSON.parse(raw);

        if (!Array.isArray(data)) {
            return [];
        }

        return data;

    } catch {

        return [];
    }
}


function saveHistory(messages) {

    try {

        /*
            تاریخچه را محدود می‌کنیم تا localStorage
            به خاطر پاسخ‌های بسیار بزرگ منفجر نشود.

            خود صفحه می‌تواند پاسخ بسیار بزرگ را نمایش دهد،
            اما ذخیره دائمی یک میلیون کلمه در localStorage
            کار درستی نیست.
        */

        const MAX_HISTORY_MESSAGES = 20;

        const trimmed =
            messages.slice(
                -MAX_HISTORY_MESSAGES
            );

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(trimmed)
        );

    } catch (error) {

        /*
            اگر localStorage پر شد،
            چت نباید خراب شود.
        */

        console.warn(
            "History storage skipped:",
            error
        );
    }
}


/* =========================================================
   SCROLL
========================================================= */

function isNearBottom() {

    const distance =
        chat.scrollHeight -
        chat.scrollTop -
        chat.clientHeight;

    return distance < 180;
}


function scrollBottom(force = false) {

    if (
        force ||
        isNearBottom()
    ) {

        chat.scrollTop =
            chat.scrollHeight;
    }
}


/* =========================================================
   MARKDOWN
========================================================= */

function renderMarkdown(text) {

    if (
        typeof marked === "undefined"
    ) {
        return escapeHtml(text);
    }

    try {

        const html =
            marked.parse(text, {
                breaks: true,
                gfm: true
            });

        if (
            typeof DOMPurify !== "undefined"
        ) {

            return DOMPurify.sanitize(
                html,
                {
                    USE_PROFILES: {
                        html: true
                    }
                }
            );
        }

        return html;

    } catch {

        return escapeHtml(text);
    }
}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================================
   COPY CODE
========================================================= */

function addCopyButtons(container) {

    const preBlocks =
        container.querySelectorAll("pre");

    preBlocks.forEach(
        (pre) => {

            if (
                pre.parentElement &&
                pre.parentElement.classList.contains(
                    "code-wrapper"
                )
            ) {
                return;
            }

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "code-wrapper";

            pre.parentNode.insertBefore(
                wrapper,
                pre
            );

            wrapper.appendChild(pre);

            const button =
                document.createElement("button");

            button.className =
                "copy-code";

            button.type =
                "button";

            button.textContent =
                "Copy";

            button.addEventListener(
                "click",
                async () => {

                    try {

                        await navigator.clipboard.writeText(
                            pre.innerText
                        );

                        button.textContent =
                            "Copied ✓";

                        setTimeout(
                            () => {
                                button.textContent =
                                    "Copy";
                            },
                            1200
                        );

                    } catch {

                        button.textContent =
                            "Error";
                    }
                }
            );

            wrapper.appendChild(
                button
            );
        }
    );
}


/* =========================================================
   MESSAGE DOM
========================================================= */

function createMessage(role) {

    const message =
        document.createElement("div");

    message.className =
        "message " + role;

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    message.appendChild(
        content
    );

    chatInner.appendChild(
        message
    );

    return {
        message,
        content
    };
}


function addUserMessage(text) {

    const ui =
        createMessage("user");

    ui.content.textContent =
        text;

    scrollBottom(true);

    return ui;
}


function addThinkingMessage() {

    const ui =
        createMessage("assistant");

    ui.content.innerHTML = `
        <div class="thinking">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    scrollBottom(true);

    return ui;
}


/* =========================================================
   STREAM RENDERER
========================================================= */

/*
    پاسخ را با Markdown رندر نمی‌کنیم
    تا وقتی stream تمام نشده است.

    دلیل:
    اگر مثلاً 100,000 کاراکتر بیاید،
    parse کردن Markdown بعد از هر chunk
    مرورگر را نابود می‌کند.

    در پایان فقط یک بار Markdown parse می‌شود.
*/

function updateStreamingMessage(
    ui,
    text
) {

    ui.content.className =
        "message-content streaming-text";

    ui.content.textContent =
        text;

    scrollBottom();
}


function finalizeStreamingMessage(
    ui,
    text
) {

    ui.content.className =
        "message-content";

    ui.content.innerHTML =
        renderMarkdown(text);

    addCopyButtons(
        ui.content
    );

    scrollBottom();
}


/* =========================================================
   FILE
========================================================= */

attachButton.addEventListener(
    "click",
    () => {
        fileInput.click();
    }
);


fileInput.addEventListener(
    "change",
    () => {

        const file =
            fileInput.files &&
            fileInput.files[0];

        if (!file) {
            return;
        }

        selectedFile =
            file;

        attachmentName.textContent =
            file.name;

        attachmentPreview.style.display =
            "block";
    }
);


removeFile.addEventListener(
    "click",
    () => {

        selectedFile =
            null;

        fileInput.value =
            "";

        attachmentPreview.style.display =
            "none";
    }
);


/* =========================================================
   FILE -> DATA URL
========================================================= */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                () => reject(
                    new Error(
                        "خطا در خواندن فایل."
                    )
                );

            reader.readAsDataURL(
                file
            );
        }
    );
}


/* =========================================================
   BUILD USER CONTENT
========================================================= */

async function buildUserContent(text) {

    if (!selectedFile) {

        return text;
    }

    const file =
        selectedFile;

    /*
        تصویر:
        OpenAI-compatible multimodal format.
    */

    if (
        file.type.startsWith(
            "image/"
        )
    ) {

        const dataURL =
            await fileToDataURL(file);

        return [
            {
                type: "text",
                text:
                    text ||
                    "این تصویر را بررسی کن."
            },

            {
                type: "image_url",
                image_url: {
                    url: dataURL
                }
            }
        ];
    }


    /*
        ویدئو:
        Qwen3.8 مدل ورودی video را پشتیبانی می‌کند،
        ولی ارسال مستقیم فایل ویدئویی بزرگ از مرورگر
        می‌تواند از محدودیت request عبور کند.

        فعلاً فایل را به‌عنوان attachment metadata
        ارسال می‌کنیم تا اتصال پایدار بماند.
    */

    if (
        file.type.startsWith(
            "video/"
        )
    ) {

        return [
            {
                type: "text",
                text:
                    (
                        text ||
                        "یک فایل ویدئویی پیوست شده است."
                    ) +
                    "\n\n" +
                    "[فایل ویدئو: " +
                    file.name +
                    "]"
            }
        ];
    }


    return text;
}


/* =========================================================
   STREAM PARSER
========================================================= */

async function readSSEStream(
    response,
    onEvent
) {

    if (!response.body) {

        throw new Error(
            "مرورگر Streaming Response را پشتیبانی نمی‌کند."
        );
    }

    const reader =
        response.body.getReader();

    const decoder =
        new TextDecoder(
            "utf-8"
        );

    let buffer = "";

    while (true) {

        const {
            value,
            done
        } = await reader.read();

        if (done) {

            if (buffer.trim()) {

                processSSEBuffer(
                    buffer,
                    onEvent
                );
            }

            break;
        }

        buffer +=
            decoder.decode(
                value,
                {
                    stream: true
                }
            );

        /*
            SSE eventها با یک خط خالی
            از هم جدا می‌شوند.
        */

        const events =
            buffer.split(
                /\r?\n\r?\n/
            );

        buffer =
            events.pop() || "";

        for (
            const eventText of events
        ) {

            processSSEBuffer(
                eventText,
                onEvent
            );
        }
    }
}


function processSSEBuffer(
    eventText,
    onEvent
) {

    const lines =
        eventText.split(
            /\r?\n/
        );

    let dataLines = [];

    for (
        const line of lines
    ) {

        if (
            line.startsWith(
                "data:"
            )
        ) {

            dataLines.push(
                line.slice(5).trim()
            );
        }
    }

    if (!dataLines.length) {
        return;
    }

    const data =
        dataLines.join("\n");

    if (!data) {
        return;
    }

    try {

        const parsed =
            JSON.parse(data);

        onEvent(parsed);

    } catch (error) {

        console.warn(
            "Bad SSE event:",
            data
        );
    }
}


/* =========================================================
   SEND
========================================================= */

async function sendMessage() {

    if (waiting) {
        return;
    }

    const rawText =
        messageInput.value.trim();

    if (
        !rawText &&
        !selectedFile
    ) {
        return;
    }

    waiting =
        true;

    sendButton.disabled =
        true;

    const originalText =
        rawText;

    try {

        const userContent =
            await buildUserContent(
                originalText
            );

        /*
            نمایش پیام کاربر
        */

        const visibleUserText =
            originalText ||
            (
                selectedFile
                    ? "📎 " + selectedFile.name
                    : ""
            );

        addUserMessage(
            visibleUserText
        );


        /*
            history برای API
        */

        let history =
            loadHistory();

        history.push({
            role: "user",
            content: userContent
        });


        /*
            محدود کردن history ارسالی.
            پاسخ‌های قدیمی بسیار بزرگ را دوباره
            برای هر درخواست ارسال نمی‌کنیم.
        */

        if (
            history.length > 30
        ) {

            history =
                history.slice(
                    -30
                );
        }


        /*
            input را پاک کن
        */

        messageInput.value =
            "";

        autoResizeTextarea();

        /*
            فایل فعلی را پاک کن
        */

        selectedFile =
            null;

        fileInput.value =
            "";

        attachmentPreview.style.display =
            "none";


        /*
            thinking
        */

        const thinking =
            addThinkingMessage();


        /*
            درخواست Streaming
        */

        const response =
            await fetch(
                CHAT_API_URL,
                {
                    method: "POST",

                    mode: "cors",

                    cache: "no-store",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "text/event-stream"
                    },

                    body: JSON.stringify({
                        messages: history
                    })
                }
            );


        /*
            HTTP error
        */

        if (!response.ok) {

            let details =
                "";

            try {
                details =
                    await response.text();
            } catch {}

            throw new Error(
                "HTTP " +
                response.status +
                (
                    details
                        ? "\n" + details
                        : ""
                )
            );
        }


        /*
            thinking را حذف کن
        */

        thinking.message.remove();


        /*
            پیام assistant
        */

        const assistant =
            createMessage(
                "assistant"
            );


        currentStreamText =
            "";

        let streamFailed =
            false;


        /*
            خواندن stream
        */

        await readSSEStream(
            response,
            (event) => {

                if (
                    event.type ===
                    "start"
                ) {

                    return;
                }


                if (
                    event.type ===
                    "delta"
                ) {

                    const chunk =
                        event.text || "";

                    if (!chunk) {
                        return;
                    }

                    currentStreamText +=
                        chunk;

                    /*
                        فقط textContent.
                        بدون Markdown parsing.
                    */

                    updateStreamingMessage(
                        assistant,
                        currentStreamText
                    );

                    return;
                }


                if (
                    event.type ===
                    "error"
                ) {

                    streamFailed =
                        true;

                    const message =
                        typeof event.error ===
                        "string"
                            ? event.error
                            : JSON.stringify(
                                event.error
                            );

                    currentStreamText +=
                        "\n\n❌ " +
                        message;

                    updateStreamingMessage(
                        assistant,
                        currentStreamText
                    );

                    return;
                }


                if (
                    event.type ===
                    "done"
                ) {

                    return;
                }
            }
        );


        /*
            اگر چیزی دریافت شده:
            Markdown را فقط یک بار رندر کن.
        */

        if (
            currentStreamText
        ) {

            finalizeStreamingMessage(
                assistant,
                currentStreamText
            );

            /*
                فقط اگر پاسخ سالم بود
                در history ذخیره می‌کنیم.
            */

            if (
                !streamFailed
            ) {

                /*
                    ذخیره پاسخ در history.
                    اگر خیلی بزرگ باشد،
                    ذخیره localStorage می‌تواند
                    غیرعملی باشد.
                */

                const answerForHistory =
                    currentStreamText.length >
                    250000
                        ? (
                            currentStreamText.slice(
                                0,
                                250000
                            ) +
                            "\n\n[ادامه پاسخ در نمایش فعلی موجود است]"
                        )
                        : currentStreamText;

                saveHistory([
                    ...history,
                    {
                        role: "assistant",
                        content:
                            answerForHistory
                    }
                ]);
            }

        } else {

            assistant.content.textContent =
                streamFailed
                    ? "❌ پاسخ از سرور دریافت نشد."
                    : "⚠️ پاسخ خالی بود.";
        }

    } catch (error) {

        console.error(
            "BEHRAD AI:",
            error
        );


        /*
            اگر مشکل fetch باشد،
            پیام واقعی‌تر نمایش می‌دهیم.
        */

        const message =
            error &&
            error.message
                ? error.message
                : String(error);


        const ui =
            createMessage(
                "assistant"
            );


        ui.content.textContent =
            "❌ ارتباط با BEHRAD AI برقرار نشد.\n\n" +
            message;


    } finally {

        waiting =
            false;

        sendButton.disabled =
            false;

        messageInput.focus();

        scrollBottom();
    }
}


/* =========================================================
   BUTTON
========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   ENTER
========================================================= */

messageInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =========================================================
   AUTO RESIZE
========================================================= */

function autoResizeTextarea() {

    messageInput.style.height =
        "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            190
        ) + "px";
}


messageInput.addEventListener(
    "input",
    autoResizeTextarea
);


/* =========================================================
   INITIAL HISTORY
========================================================= */

function restoreHistory() {

    const history =
        loadHistory();

    /*
        تاریخچه فقط برای نمایش است.
        پیام‌های دارای image object را
        به شکل ساده نمایش می‌دهیم.
    */

    for (
        const item of history
    ) {

        if (
            !item ||
            !item.role
        ) {
            continue;
        }

        let text = "";

        if (
            typeof item.content ===
            "string"
        ) {

            text =
                item.content;

        } else if (
            Array.isArray(
                item.content
            )
        ) {

            const textParts =
                item.content
                    .filter(
                        x =>
                            x &&
                            x.type ===
                            "text"
                    )
                    .map(
                        x =>
                            x.text || ""
                    );

            text =
                textParts.join(
                    "\n"
                );

            if (
                item.content.some(
                    x =>
                        x &&
                        x.type ===
                        "image_url"
                )
            ) {

                text +=
                    "\n📷 [تصویر]";
            }
        }

        if (!text) {
            continue;
        }

        const ui =
            createMessage(
                item.role ===
                "user"
                    ? "user"
                    : "assistant"
            );

        if (
            item.role ===
            "user"
        ) {

            ui.content.textContent =
                text;

        } else {

            ui.content.innerHTML =
                renderMarkdown(
                    text
                );

            addCopyButtons(
                ui.content
            );
        }
    }

    scrollBottom(true);
}


/* =========================================================
   START
========================================================= */

restoreHistory();

autoResizeTextarea();

messageInput.focus();
</script>

</html>
