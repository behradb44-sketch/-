<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>BEHRAD AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #212121;
    color: #ececec;
    font-family: Tahoma, Arial, sans-serif;
}

body {
    overflow: hidden;
}

button,
textarea,
input {
    font-family: inherit;
}

.app {
    width: 100%;
    height: 100dvh;
    min-height: 0;
    display: flex;
    background: #212121;
}

.sidebar {
    width: 260px;
    flex: 0 0 260px;
    height: 100%;
    background: #171717;
    border-left: 1px solid #303030;
    padding: 12px;
    display: flex;
    flex-direction: column;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 8px;
}

.logo {
    width: 35px;
    height: 35px;
    border-radius: 10px;
    background: #10a37f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

.brand-name {
    font-weight: bold;
    font-size: 16px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #3d3d3d;
    background: #212121;
    color: white;
    cursor: pointer;
    text-align: right;
}

.new-chat:hover {
    background: #292929;
}

.history-title {
    color: #777;
    font-size: 11px;
    margin: 22px 8px 8px;
}

.history {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
}

.history-item {
    padding: 9px;
    border-radius: 7px;
    color: #aaa;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-item:hover {
    background: #242424;
    color: white;
}

.sidebar-bottom {
    border-top: 1px solid #303030;
    padding: 12px 7px 5px;
    color: #666;
    font-size: 10px;
    line-height: 1.8;
}

.main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 58px;
    flex: 0 0 58px;
    border-bottom: 1px solid #303030;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 22px;
    background: #212121;
}

.model-name {
    font-size: 14px;
    font-weight: bold;
}

.model-status {
    color: #777;
    font-size: 11px;
}

.chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 25px 15px 25px;
}

.chat-inner {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
}

.welcome {
    min-height: 65vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

.welcome-logo {
    width: 58px;
    height: 58px;
    border-radius: 17px;
    background: #10a37f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin-bottom: 18px;
}

.welcome h1 {
    font-size: 25px;
    margin: 0 0 9px;
}

.welcome p {
    margin: 0;
    color: #888;
    font-size: 13px;
}

.message {
    display: flex;
    gap: 13px;
    margin-bottom: 30px;
    animation: messageIn .16s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.avatar {
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: bold;
}

.user .avatar {
    background: #444;
}

.assistant .avatar {
    background: #10a37f;
}

.message-body {
    flex: 1;
    min-width: 0;
}

.message-name {
    color: #999;
    font-size: 11px;
    margin-bottom: 7px;
}

.message-content {
    font-size: 14px;
    line-height: 1.9;
    overflow-wrap: anywhere;
}

.message-content p {
    margin: 0 0 12px;
}

.message-content p:last-child {
    margin-bottom: 0;
}

.message-content code:not(pre code) {
    background: #2b2b2b;
    border: 1px solid #3a3a3a;
    border-radius: 5px;
    padding: 2px 6px;
    font-family: Consolas, monospace;
}

.code-wrap {
    position: relative;
    margin: 14px 0;
}

.code-wrap pre {
    margin: 0;
    padding: 17px;
    border-radius: 10px;
    background: #111;
    border: 1px solid #303030;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
}

.code-wrap pre code {
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
}

.copy-code {
    position: absolute;
    top: 7px;
    left: 8px;
    background: #222;
    color: #bbb;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 5px 9px;
    cursor: pointer;
    font-size: 10px;
}

.copy-code:hover {
    background: #333;
    color: white;
}

.thinking {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #888;
    font-size: 11px;
}

.wave {
    height: 18px;
    display: flex;
    align-items: center;
    gap: 3px;
}

.wave span {
    width: 3px;
    height: 7px;
    border-radius: 4px;
    background: #10a37f;
    animation: wave .75s infinite ease-in-out;
}

.wave span:nth-child(2) {
    animation-delay: .1s;
}

.wave span:nth-child(3) {
    animation-delay: .2s;
}

.wave span:nth-child(4) {
    animation-delay: .3s;
}

.wave span:nth-child(5) {
    animation-delay: .4s;
}

@keyframes wave {
    0%,100% {
        height: 6px;
    }

    50% {
        height: 17px;
    }
}

/* ================================
   INPUT
================================ */

.input-area {
    flex: 0 0 auto;
    width: 100%;
    padding:
        10px
        max(10px, env(safe-area-inset-right))
        calc(12px + env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    background: #212121;
}

.input-box {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    min-height: 54px;
    display: flex;
    align-items: flex-end;
    gap: 3px;
    padding: 7px;
    background: #2f2f2f;
    border: 1px solid #454545;
    border-radius: 15px;
}

textarea {
    flex: 1;
    min-width: 0;
    min-height: 40px;
    max-height: 150px;
    resize: none;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    padding: 8px 9px;
    line-height: 1.65;
    font-size: 14px;
}

textarea::placeholder {
    color: #777;
}

.attach,
.send {
    flex: 0 0 39px;
    width: 39px;
    height: 39px;
    border-radius: 10px;
    border: 0;
    cursor: pointer;
}

.attach {
    background: transparent;
    color: #aaa;
    font-size: 18px;
}

.attach:hover {
    background: #3a3a3a;
    color: white;
}

.send {
    background: #10a37f;
    color: white;
    font-size: 17px;
}

.send:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.file-preview {
    width: 100%;
    max-width: 850px;
    margin: 0 auto 7px;
    padding: 7px 10px;
    border: 1px solid #3d3d3d;
    border-radius: 8px;
    background: #2a2a2a;
    color: #aaa;
    display: none;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
}

.remove-file {
    border: 0;
    background: transparent;
    color: #888;
    cursor: pointer;
    font-size: 17px;
}

.attached-image {
    max-width: min(420px, 100%);
    max-height: 320px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #444;
}

@media (max-width: 760px) {

    .sidebar {
        display: none;
    }

    .topbar {
        height: 52px;
        flex-basis: 52px;
        padding: 0 14px;
    }

    .chat {
        padding:
            18px 10px 18px;
    }

    .chat-inner {
        max-width: 100%;
    }

    .message {
        gap: 9px;
        margin-bottom: 25px;
    }

    .avatar {
        width: 29px;
        height: 29px;
        flex-basis: 29px;
    }

    .message-content {
        font-size: 13px;
    }

    .welcome h1 {
        font-size: 20px;
    }

    .input-area {
        padding:
            7px
            8px
            calc(8px + env(safe-area-inset-bottom))
            8px;
    }

    .input-box {
        min-height: 52px;
        border-radius: 14px;
    }

    textarea {
        font-size: 13px;
    }

    .attach,
    .send {
        width: 37px;
        height: 37px;
        flex-basis: 37px;
    }
}

</style>

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">

            <div class="logo">
                BA
            </div>

            <div class="brand-name">
                BEHRAD AI
            </div>

        </div>

        <button
            class="new-chat"
            id="newChat"
        >
            ＋ چت جدید
        </button>

        <div class="history-title">
            تاریخچه
        </div>

        <div
            class="history"
            id="history"
        ></div>

        <div class="sidebar-bottom">
            BEHRAD AI
            <br>
            ساخته‌شده توسط بهراد محمدی
            <br>
            BEHRAD M PLAYER
        </div>

    </aside>


    <main class="main">

        <div class="topbar">

            <span class="model-name">
                BEHRAD AI
            </span>

            <span class="model-status">
                Space Bunny Alpha
            </span>

        </div>


        <div
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-logo">
                        BA
                    </div>

                    <h1>
                        چه کاری می‌تونم برات انجام بدم؟
                    </h1>

                    <p>
                        BEHRAD AI آماده‌ست 🚀
                    </p>

                </div>

            </div>

        </div>


        <div class="input-area">

            <div
                class="file-preview"
                id="filePreview"
            >

                <span id="fileName"></span>

                <button
                    class="remove-file"
                    id="removeFile"
                >
                    ×
                </button>

            </div>

            <div class="input-box">

                <input
                    type="file"
                    id="fileInput"
                    accept="image/*,video/*"
                    hidden
                >

                <button
                    class="attach"
                    id="attachButton"
                >
                    ＋
                </button>

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="پیامت رو بنویس..."
                ></textarea>

                <button
                    class="send"
                    id="sendButton"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<script>

const API_URL = "/api/chat";

const STORAGE_KEY =
    "behrad_ai_stable_v3";

const MAX_HISTORY = 12;

let messages = [];

let selectedFile = null;

let selectedImageData = null;

let generating = false;


const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const welcome =
    document.getElementById("welcome");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const attachButton =
    document.getElementById("attachButton");

const fileInput =
    document.getElementById("fileInput");

const filePreview =
    document.getElementById("filePreview");

const fileName =
    document.getElementById("fileName");

const removeFile =
    document.getElementById("removeFile");

const historyElement =
    document.getElementById("history");

const newChat =
    document.getElementById("newChat");


function isNearBottom() {

    return (
        chat.scrollHeight -
        chat.scrollTop -
        chat.clientHeight
    ) < 120;

}


function scrollBottom(force = false) {

    if (
        force ||
        isNearBottom()
    ) {

        chat.scrollTop =
            chat.scrollHeight;

    }

}


function saveHistory() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                messages
                    .slice(-MAX_HISTORY)
                    .map(m => ({
                        role: m.role,
                        content:
                            typeof m.content === "string"
                                ? m.content
                                : ""
                    }))
            )
        );

    } catch (e) {

        console.error(e);

    }

}


function loadHistory() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!raw) {
            return;
        }

        const data =
            JSON.parse(raw);

        if (
            Array.isArray(data)
        ) {

            messages =
                data;

            renderAll();

        }

    } catch (e) {

        console.error(
            "History:",
            e
        );

        messages = [];

    }

}


function renderMarkdown(text) {

    try {

        return DOMPurify.sanitize(
            marked.parse(
                text || ""
            )
        );

    } catch {

        return escapeHtml(
            text || ""
        );

    }

}


function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


function setupCodeButtons(container) {

    container
        .querySelectorAll("pre")
        .forEach(pre => {

            if (
                pre.parentElement.classList.contains(
                    "code-wrap"
                )
            ) {
                return;
            }

            const wrap =
                document.createElement(
                    "div"
                );

            wrap.className =
                "code-wrap";

            pre.parentNode.insertBefore(
                wrap,
                pre
            );

            wrap.appendChild(
                pre
            );

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "copy-code";

            button.textContent =
                "کپی";

            button.onclick =
                async () => {

                    try {

                        await navigator
                            .clipboard
                            .writeText(
                                pre.innerText
                            );

                        button.textContent =
                            "کپی شد ✓";

                        setTimeout(
                            () => {
                                button.textContent =
                                    "کپی";
                            },
                            1200
                        );

                    } catch {

                        button.textContent =
                            "خطا";

                    }

                };

            wrap.appendChild(
                button
            );

        });

}


function createMessage(message) {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        `message ${message.role}`;

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        message.role === "user"
            ? "شما"
            : "AI";

    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";

    const name =
        document.createElement(
            "div"
        );

    name.className =
        "message-name";

    name.textContent =
        message.role === "user"
            ? "شما"
            : "BEHRAD AI";

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";

    if (
        message.role === "user"
    ) {

        content.textContent =
            message.content || "";

    } else {

        content.innerHTML =
            renderMarkdown(
                message.content || ""
            );

        setupCodeButtons(
            content
        );

    }

    body.appendChild(name);
    body.appendChild(content);

    row.appendChild(avatar);
    row.appendChild(body);

    return row;

}


function renderAll() {

    chatInner.innerHTML = "";

    if (
        messages.length === 0
    ) {

        chatInner.appendChild(
            welcome
        );

        return;

    }

    messages.forEach(message => {

        chatInner.appendChild(
            createMessage(message)
        );

    });

    renderHistory();

    requestAnimationFrame(
        () => scrollBottom(true)
    );

}


function renderHistory() {

    historyElement.innerHTML = "";

    messages
        .filter(
            m => m.role === "user"
        )
        .slice(-10)
        .forEach(message => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";

            item.textContent =
                String(
                    message.content || ""
                )
                .replace(
                    /\s+/g,
                    " "
                )
                .slice(
                    0,
                    50
                );

            historyElement.appendChild(
                item
            );

        });

}


function createThinking() {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        "message assistant";

    row.id =
        "thinking";

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        "AI";

    const body =
        document.createElement(
            "div"
        );

    body.className =
        "message-body";

    const name =
        document.createElement(
            "div"
        );

    name.className =
        "message-name";

    name.textContent =
        "BEHRAD AI";

    const thinking =
        document.createElement(
            "div"
        );

    thinking.className =
        "thinking";

    const wave =
        document.createElement(
            "div"
        );

    wave.className =
        "wave";

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        const span =
            document.createElement(
                "span"
            );

        wave.appendChild(
            span
        );

    }

    const text =
        document.createElement(
            "span"
        );

    text.textContent =
        "در حال فکر کردن و بررسی وب...";

    thinking.appendChild(wave);
    thinking.appendChild(text);

    body.appendChild(name);
    body.appendChild(thinking);

    row.appendChild(avatar);
    row.appendChild(body);

    return row;

}


function smoothReveal(
    element,
    text,
    follow
) {

    return new Promise(resolve => {

        let index = 0;

        const length =
            text.length;

        function tick() {

            if (
                index >= length
            ) {

                element.innerHTML =
                    renderMarkdown(
                        text
                    );

                setupCodeButtons(
                    element
                );

                resolve();

                return;
            }

            let step = 5;

            if (
                length > 3000
            ) {
                step = 10;
            } else if (
                length > 1500
            ) {
                step = 7;
            }

            index =
                Math.min(
                    index + step,
                    length
                );

            element.textContent =
                text.slice(
                    0,
                    index
                );

            if (
                follow &&
                isNearBottom()
            ) {

                chat.scrollTop =
                    chat.scrollHeight;

            }

            setTimeout(
                tick,
                6
            );

        }

        tick();

    });

}


attachButton.onclick =
    () => fileInput.click();


fileInput.onchange =
    () => {

        const file =
            fileInput.files[0];

        if (!file) {
            return;
        }

        selectedFile =
            file;

        fileName.textContent =
            file.name;

        filePreview.style.display =
            "flex";

        if (
            file.type.startsWith(
                "image/"
            )
        ) {

            const reader =
                new FileReader();

            reader.onload =
                () => {

                    selectedImageData =
                        reader.result;

                };

            reader.readAsDataURL(
                file
            );

        } else {

            selectedImageData =
                null;

        }

    };


removeFile.onclick =
    () => {

        selectedFile = null;
        selectedImageData = null;

        fileInput.value = "";

        filePreview.style.display =
            "none";

    };


async function sendMessage() {

    if (generating) {
        return;
    }

    const text =
        input.value.trim();

    if (
        !text &&
        !selectedFile
    ) {
        return;
    }

    const follow =
        isNearBottom();

    generating = true;

    sendButton.disabled = true;

    let displayText =
        text;

    if (selectedFile) {

        if (displayText) {
            displayText += "\n\n";
        }

        displayText +=
            selectedImageData
                ? `🖼️ تصویر: ${selectedFile.name}`
                : `🎬 ویدئو پیوست شد: ${selectedFile.name}`;

    }

    let apiContent =
        displayText;

    if (selectedImageData) {

        apiContent = [
            {
                type: "text",
                text:
                    text ||
                    "این تصویر را بررسی کن."
            },
            {
                type: "image_url",
                image_url: {
                    url:
                        selectedImageData
                }
            }
        ];

    }

    const userMessage = {
        role: "user",
        content: displayText,
        apiContent
    };

    if (
        welcome.parentNode
    ) {
        welcome.remove();
    }

    messages.push(
        userMessage
    );

    const userElement =
        createMessage(
            userMessage
        );

    chatInner.appendChild(
        userElement
    );

    if (
        selectedImageData
    ) {

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "attached-image";

        img.src =
            selectedImageData;

        userElement
            .querySelector(
                ".message-content"
            )
            .appendChild(img);

    }

    saveHistory();
    renderHistory();

    input.value = "";
    input.style.height = "auto";

    selectedFile = null;
    selectedImageData = null;

    fileInput.value = "";

    filePreview.style.display =
        "none";

    const thinking =
        createThinking();

    chatInner.appendChild(
        thinking
    );

    if (follow) {
        requestAnimationFrame(
            () => scrollBottom(true)
        );
    }

    try {

        const apiMessages =
            messages
                .slice(-MAX_HISTORY)
                .map(message => {

                    return {
                        role:
                            message.role,

                        content:
                            message.apiContent ||
                            message.content ||
                            ""
                    };

                });

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            messages:
                                apiMessages
                        })
                }
            );

        /*
         * اول متن خام را می‌گیریم.
         * این جلوی خطای:
         * Unexpected token <
         * و خطاهای مشابه را می‌گیرد.
         */

        const raw =
            await response.text();

        let data = null;

        try {

            data =
                JSON.parse(raw);

        } catch {

            console.error(
                "Raw server response:",
                raw
            );

            throw new Error(
                response.ok
                    ? "سرور پاسخ JSON معتبر نداد."
                    : `سرور خطا داد (HTTP ${response.status})`
            );

        }

        if (
            !response.ok ||
            !data.success
        ) {

            let error =
                data.error ||
                `خطای سرور (${response.status})`;

            if (
                data.details
            ) {

                console.error(
                    "Server details:",
                    data.details
                );

            }

            throw new Error(
                error
            );

        }

        const answer =
            String(
                data.reply || ""
            ).trim();

        if (!answer) {

            throw new Error(
                "پاسخ خالی از سرور دریافت شد."
            );

        }

        thinking.remove();

        const assistant =
            {
                role: "assistant",
                content: answer
            };

        messages.push(
            assistant
        );

        const assistantElement =
            createMessage(
                assistant
            );

        chatInner.appendChild(
            assistantElement
        );

        const content =
            assistantElement
                .querySelector(
                    ".message-content"
                );

        await smoothReveal(
            content,
            answer,
            follow
        );

        saveHistory();
        renderHistory();

    } catch (error) {

        console.error(
            "BEHRAD AI ERROR:",
            error
        );

        if (
            thinking.parentNode
        ) {
            thinking.remove();
        }

        const errorMessage = {
            role: "assistant",
            content:
                `❌ ${error.message}`
        };

        messages.push(
            errorMessage
        );

        chatInner.appendChild(
            createMessage(
                errorMessage
            )
        );

        saveHistory();
        renderHistory();

    } finally {

        generating = false;

        sendButton.disabled = false;

        input.focus();

    }

}


sendButton.onclick =
    sendMessage;


input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                150
            ) + "px";

    }
);


newChat.onclick =
    () => {

        if (generating) {
            return;
        }

        messages = [];

        localStorage.removeItem(
            STORAGE_KEY
        );

        chatInner.innerHTML = "";

        chatInner.appendChild(
            welcome
        );

        renderHistory();

        input.focus();

    };


loadHistory();

input.focus();

</script>

</body>
</html>
