<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>BEHRAD AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    background:#212121;
    color:#ececec;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}

/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    background:#212121;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    height:58px;
    min-height:58px;

    display:flex;
    align-items:center;

    padding:0 18px;

    border-bottom:1px solid #333;

    background:#212121;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:16px;
    font-weight:bold;
}

.logo{
    width:34px;
    height:34px;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#111;
    border:1px solid #444;

    font-size:18px;
}

.model{
    margin-right:auto;

    font-size:12px;
    color:#9b9b9b;
}

/* =====================================================
   CHAT
===================================================== */

.chat{
    flex:1;

    min-height:0;

    overflow-y:auto;
    overflow-x:hidden;

    scroll-behavior:auto;

    padding:28px 14px 18px;
}

.chat-inner{
    width:100%;
    max-width:820px;

    margin:auto;
}

/* =====================================================
   MESSAGE
===================================================== */

.message{
    display:flex;

    margin:0 auto 25px;

    width:100%;
}

.message.user{
    justify-content:flex-start;
}

.message.assistant{
    justify-content:flex-start;
}

.message-content{
    max-width:82%;

    line-height:1.85;

    font-size:15px;

    word-break:break-word;
}

.user .message-content{
    background:#2f2f2f;

    border:1px solid #414141;

    padding:11px 15px;

    border-radius:18px 18px 5px 18px;
}

.assistant .message-content{
    background:transparent;

    padding:3px 0;
}

/* =====================================================
   MARKDOWN
===================================================== */

.message-content p{
    margin:0 0 12px;
}

.message-content p:last-child{
    margin-bottom:0;
}

.message-content ul,
.message-content ol{
    padding-right:25px;
}

.message-content pre{
    direction:ltr;
    text-align:left;

    overflow:auto;

    background:#111;
    border:1px solid #333;

    border-radius:10px;

    padding:14px;

    margin:14px 0;
}

.message-content code{
    font-family:
        Consolas,
        "Courier New",
        monospace;
}

.message-content :not(pre) > code{
    background:#303030;

    border-radius:5px;

    padding:2px 5px;

    direction:ltr;
}

/* =====================================================
   CODE COPY
===================================================== */

.code-wrap{
    position:relative;
}

.copy-code{
    position:absolute;

    top:8px;
    left:8px;

    border:1px solid #444;

    background:#222;
    color:#ddd;

    border-radius:7px;

    padding:5px 9px;

    font-size:11px;

    cursor:pointer;
}

.copy-code:hover{
    background:#333;
}

/* =====================================================
   THINKING
===================================================== */

.thinking{
    display:flex;
    align-items:center;
    gap:7px;

    height:28px;
}

.wave{
    display:flex;
    align-items:center;
    gap:3px;
}

.wave span{
    width:3px;
    height:8px;

    background:#aaa;

    border-radius:5px;

    animation:wave 1s infinite ease-in-out;
}

.wave span:nth-child(2){
    animation-delay:.1s;
}

.wave span:nth-child(3){
    animation-delay:.2s;
}

.wave span:nth-child(4){
    animation-delay:.3s;
}

.wave span:nth-child(5){
    animation-delay:.4s;
}

@keyframes wave{

    0%,
    100%{
        height:7px;
        opacity:.4;
    }

    50%{
        height:17px;
        opacity:1;
    }
}

.thinking-text{
    font-size:12px;
    color:#8c8c8c;
}

/* =====================================================
   INPUT AREA
===================================================== */

.input-area{
    flex:none;

    width:100%;

    padding:
        10px
        14px
        calc(10px + env(safe-area-inset-bottom));

    background:#212121;
}

.input-box{
    width:100%;
    max-width:820px;

    margin:auto;

    display:flex;
    align-items:flex-end;
    gap:8px;

    background:#2f2f2f;

    border:1px solid #454545;

    border-radius:18px;

    padding:8px;

    box-shadow:
        0 4px 20px rgba(0,0,0,.18);
}

textarea{
    flex:1;

    min-width:0;

    height:42px;
    max-height:180px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:#eee;

    font-family:inherit;
    font-size:14px;

    line-height:1.7;

    padding:8px 9px;
}

textarea::placeholder{
    color:#888;
}

.button{
    width:40px;
    height:40px;

    flex:none;

    border:0;

    border-radius:12px;

    background:#ececec;
    color:#171717;

    cursor:pointer;

    font-size:17px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.button:hover{
    background:#fff;
}

.button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* =====================================================
   ATTACH
===================================================== */

.attach{
    position:relative;
}

.attach input{
    position:absolute;

    width:1px;
    height:1px;

    opacity:0;
}

.attach-button{
    width:40px;
    height:40px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    color:#bbb;
}

.attach-button:hover{
    background:#3a3a3a;
}

/* =====================================================
   ATTACHMENT PREVIEW
===================================================== */

.preview{
    width:100%;
    max-width:820px;

    margin:0 auto 7px;

    display:none;

    background:#2a2a2a;

    border:1px solid #3d3d3d;

    border-radius:12px;

    padding:9px;

    font-size:12px;
    color:#bbb;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .header{
        padding:0 12px;
    }

    .model{
        display:none;
    }

    .chat{
        padding:20px 10px 12px;
    }

    .message-content{
        max-width:90%;
        font-size:14px;
    }

    .input-area{
        padding-left:8px;
        padding-right:8px;
    }

    .input-box{
        border-radius:16px;
    }

    textarea{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                ✦
            </div>

            <span>
                BEHRAD AI
            </span>

        </div>

        <div class="model">
            Qwen3.8 27B Free
        </div>

    </header>


    <main class="chat" id="chat">

        <div class="chat-inner" id="chatInner"></div>

    </main>


    <div class="input-area">

        <div class="preview" id="preview"></div>

        <div class="input-box">

            <label class="attach">

                <input
                    type="file"
                    id="fileInput"
                    accept="image/*,video/*"
                >

                <span class="attach-button">
                    ＋
                </span>

            </label>

            <textarea
                id="messageInput"
                placeholder="پیامت رو بنویس..."
                rows="1"
            ></textarea>

            <button
                class="button"
                id="sendButton"
                title="ارسال"
            >
                ↑
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

/*
 * مهم:
 * چون BEHRAD AI روی GitHub Pages اجرا می‌شود،
 * نباید /api/chat را نسبی صدا بزنیم.
 *
 * درخواست مستقیماً به Render می‌رود.
 */

const API_BASE_URL =
    "https://k6k83zh1yv.onrender.com";

const CHAT_API_URL =
    `${API_BASE_URL}/api/chat`;


const STORAGE_KEY =
    "behrad_ai_fast_v4";


const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const fileInput =
    document.getElementById("fileInput");

const preview =
    document.getElementById("preview");


let messages = [];

let selectedFile = null;

let waiting = false;


/* =====================================================
   STORAGE
===================================================== */

function save(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                messages.map(m => ({
                    role:m.role,
                    content:m.content
                }))
            )
        );

    }catch(e){

        console.warn(
            "Storage error:",
            e
        );

    }
}


function load(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!raw){
            return;
        }

        const data =
            JSON.parse(raw);

        if(!Array.isArray(data)){
            return;
        }

        messages =
            data.slice(-10);

        renderAll();

    }catch(e){

        console.warn(
            "Load history error:",
            e
        );

    }
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;
}


/* =====================================================
   MARKDOWN
===================================================== */

function renderMarkdown(text){

    try{

        const html =
            marked.parse(
                text || ""
            );

        return DOMPurify.sanitize(
            html
        );

    }catch{

        return escapeHtml(
            text || ""
        );

    }
}


/* =====================================================
   CODE COPY
===================================================== */

function addCopyButtons(container){

    container
        .querySelectorAll("pre")
        .forEach(pre => {

            if(
                pre.parentElement &&
                pre.parentElement.classList.contains(
                    "code-wrap"
                )
            ){
                return;
            }

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "code-wrap";

            pre.parentNode.insertBefore(
                wrapper,
                pre
            );

            wrapper.appendChild(
                pre
            );

            const button =
                document.createElement("button");

            button.className =
                "copy-code";

            button.type =
                "button";

            button.textContent =
                "کپی";

            button.onclick = async () => {

                const code =
                    pre.innerText;

                try{

                    await navigator.clipboard.writeText(
                        code
                    );

                    button.textContent =
                        "کپی شد ✓";

                    setTimeout(() => {

                        button.textContent =
                            "کپی";

                    },1200);

                }catch{

                    button.textContent =
                        "خطا";

                }

            };

            wrapper.appendChild(
                button
            );

        });

}


/* =====================================================
   RENDER
===================================================== */

function renderMessage(message){

    const row =
        document.createElement("div");

    row.className =
        `message ${message.role}`;

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    if(message.role === "assistant"){

        content.innerHTML =
            renderMarkdown(
                message.content
            );

        addCopyButtons(
            content
        );

    }else{

        content.textContent =
            message.content;

    }

    row.appendChild(
        content
    );

    chatInner.appendChild(
        row
    );

    return row;
}


function renderAll(){

    chatInner.innerHTML = "";

    for(
        const message of messages
    ){

        renderMessage(
            message
        );

    }

    scrollBottom();
}


/* =====================================================
   SCROLL
===================================================== */

function isNearBottom(){

    const distance =
        chat.scrollHeight -
        chat.scrollTop -
        chat.clientHeight;

    return distance < 180;
}


function scrollBottom(){

    chat.scrollTop =
        chat.scrollHeight;
}


/* =====================================================
   THINKING
===================================================== */

function showThinking(){

    const row =
        document.createElement("div");

    row.className =
        "message assistant";

    row.id =
        "thinkingRow";

    row.innerHTML = `
        <div class="message-content">

            <div class="thinking">

                <div class="wave">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <span class="thinking-text">
                    در حال فکر کردن...
                </span>

            </div>

        </div>
    `;

    chatInner.appendChild(
        row
    );

    if(isNearBottom()){

        scrollBottom();

    }
}


function hideThinking(){

    const row =
        document.getElementById(
            "thinkingRow"
        );

    if(row){

        row.remove();

    }
}


/* =====================================================
   SMOOTH ANSWER REVEAL
===================================================== */

async function smoothReveal(
    element,
    text
){

    const wasNearBottom =
        isNearBottom();

    let current = "";

    const chunkSize = 6;

    for(
        let i = 0;
        i < text.length;
        i += chunkSize
    ){

        current +=
            text.slice(
                i,
                i + chunkSize
            );

        element.innerHTML =
            renderMarkdown(
                current
            );

        addCopyButtons(
            element
        );

        if(
            wasNearBottom &&
            isNearBottom()
        ){

            scrollBottom();

        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    8
                )
        );

    }

}


/* =====================================================
   FILE
===================================================== */

fileInput.addEventListener(
    "change",
    () => {

        selectedFile =
            fileInput.files[0] || null;

        if(!selectedFile){

            preview.style.display =
                "none";

            preview.textContent =
                "";

            return;
        }

        preview.style.display =
            "block";

        preview.textContent =
            `📎 ${selectedFile.name}`;

    }
);


/* =====================================================
   IMAGE DATA
===================================================== */

function fileToDataURL(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   API ERROR
===================================================== */

function getServerErrorMessage(
    status,
    data
){

    if(
        data &&
        data.error
    ){

        if(
            typeof data.error === "string"
        ){

            return data.error;

        }

        if(
            typeof data.error === "object" &&
            data.error.message
        ){

            return data.error.message;

        }

    }

    if(status === 405){

        return "روش ارسال درخواست به سرور اشتباه است (HTTP 405).";

    }

    if(status === 401){

        return "احراز هویت سرور مشکل دارد.";

    }

    if(status === 429){

        return "مدل فعلاً درخواست‌های زیادی دریافت کرده. چند ثانیه بعد دوباره امتحان کن.";

    }

    if(status >= 500){

        return "سرور BEHRAD AI نتوانست پاسخ مدل را دریافت کند.";

    }

    return `خطای سرور HTTP ${status}`;

}


/* =====================================================
   SEND
===================================================== */

async function sendMessage(){

    if(waiting){

        return;

    }

    const text =
        input.value.trim();

    if(
        !text &&
        !selectedFile
    ){

        return;

    }

    waiting = true;

    sendButton.disabled =
        true;


    /* ---------------------------------------------
       Prepare user message
    --------------------------------------------- */

    let visibleText =
        text;

    let apiContent =
        text;


    if(selectedFile){

        if(
            selectedFile.type.startsWith(
                "image/"
            )
        ){

            try{

                const dataURL =
                    await fileToDataURL(
                        selectedFile
                    );

                visibleText =
                    text
                    ? `${text}\n📷 ${selectedFile.name}`
                    : `📷 ${selectedFile.name}`;

                apiContent = [

                    {
                        type:"text",

                        text:
                            text ||
                            "این تصویر را بررسی کن."
                    },

                    {
                        type:"image_url",

                        image_url:{
                            url:dataURL
                        }
                    }

                ];

            }catch(error){

                console.error(
                    "Image read error:",
                    error
                );

                visibleText =
                    text ||
                    `📷 ${selectedFile.name}`;

                apiContent =
                    text ||
                    `تصویر پیوست شد: ${selectedFile.name}`;

            }

        }else{

            /*
             * در نسخه فعلی، فایل ویدئویی خام را
             * مستقیماً به API نمی‌فرستیم.
             *
             * این کار جلوی خطاهای Provider را می‌گیرد.
             */

            visibleText =
                text
                ? `${text}\n🎥 ${selectedFile.name}`
                : `🎥 ${selectedFile.name}`;

            apiContent =
                text
                ? `${text}\n[ویدئو پیوست شد: ${selectedFile.name}]`
                : `[ویدئو پیوست شد: ${selectedFile.name}]`;

        }

    }


    /* ---------------------------------------------
       Add user message
    --------------------------------------------- */

    const userMessage = {

        role:"user",

        content:
            visibleText,

        apiContent:
            apiContent

    };


    messages.push(
        userMessage
    );

    messages =
        messages.slice(-10);


    renderMessage(
        userMessage
    );


    save();


    input.value =
        "";

    input.style.height =
        "42px";


    selectedFile =
        null;

    fileInput.value =
        "";

    preview.style.display =
        "none";

    preview.textContent =
        "";


    scrollBottom();


    /* ---------------------------------------------
       Thinking
    --------------------------------------------- */

    showThinking();


    try{

        /*
         * فقط پیام‌های واقعی برای API
         * فرستاده می‌شوند.
         */

        const apiMessages =
            messages.map(
                message => ({

                    role:
                        message.role,

                    content:
                        message.apiContent ??
                        message.content

                })
            );


        /* -----------------------------------------
           API REQUEST
        ----------------------------------------- */

        const response =
            await fetch(
                CHAT_API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            messages:
                                apiMessages
                        })
                }
            );


        const raw =
            await response.text();


        let data = null;


        try{

            data =
                JSON.parse(
                    raw
                );

        }catch{

            console.error(
                "SERVER RAW RESPONSE:",
                raw
            );

            throw new Error(
                response.ok
                ? "سرور پاسخ JSON معتبر نداد."
                : `سرور خطا داد (HTTP ${response.status})`
            );

        }


        /* -----------------------------------------
           HTTP ERROR
        ----------------------------------------- */

        if(!response.ok){

            throw new Error(
                getServerErrorMessage(
                    response.status,
                    data
                )
            );

        }


        /* -----------------------------------------
           NEW BACKEND FORMAT
           ok + answer
        ----------------------------------------- */

        const reply =
            data.answer ??
            data.reply ??
            (
                data.response &&
                typeof data.response === "string"
                    ? data.response
                    : null
            );


        if(
            !data.ok &&
            !data.success &&
            !reply
        ){

            throw new Error(
                getServerErrorMessage(
                    response.status,
                    data
                )
            );

        }


        if(
            !reply ||
            !String(reply).trim()
        ){

            throw new Error(
                "مدل پاسخ متنی برنگرداند."
            );

        }


        hideThinking();


        /* -----------------------------------------
           Assistant message
        ----------------------------------------- */

        const assistantMessage = {

            role:
                "assistant",

            content:
                String(reply)

        };


        messages.push(
            assistantMessage
        );

        messages =
            messages.slice(-10);


        const row =
            document.createElement(
                "div"
            );


        row.className =
            "message assistant";


        const content =
            document.createElement(
                "div"
            );


        content.className =
            "message-content";


        row.appendChild(
            content
        );


        chatInner.appendChild(
            row
        );


        await smoothReveal(
            content,
            assistantMessage.content
        );


        save();


    }catch(error){

        hideThinking();


        console.error(
            "BEHRAD AI ERROR:",
            error
        );


        const errorMessage = {

            role:
                "assistant",

            content:
                `❌ ${error.message || "خطای ناشناخته‌ای رخ داد."}`

        };


        messages.push(
            errorMessage
        );

        messages =
            messages.slice(-10);


        renderMessage(
            errorMessage
        );


        save();

    }finally{

        waiting = false;

        sendButton.disabled =
            false;

        input.focus();

    }

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   AUTO RESIZE
===================================================== */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "42px";

        input.style.height =
            Math.min(
                input.scrollHeight,
                180
            ) + "px";

    }
);


/* =====================================================
   START
===================================================== */

load();


if(messages.length === 0){

    messages.push({

        role:"assistant",

        content:
            "سلام! 👋 من **BEHRAD AI** هستم. چه کاری برات انجام بدم؟"

    });

    save();

    renderAll();

}


input.focus();

</script>

</body>
</html>
