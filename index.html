<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BEHRAD AI</title>

<style>

*{
    box-sizing:border-box;
}

:root{
    --bg:#212121;
    --sidebar:#171717;
    --panel:#2f2f2f;
    --panel2:#252525;
    --border:#3d3d3d;
    --text:#ececec;
    --muted:#9b9b9b;
    --green:#10a37f;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    overflow:hidden;
}

/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:260px;
    height:100%;
    background:var(--sidebar);

    border-left:
        1px solid #303030;

    display:flex;
    flex-direction:column;

    padding:12px;
}

.brand{
    height:48px;

    display:flex;
    align-items:center;

    gap:10px;

    padding:0 10px;

    font-weight:bold;
    font-size:16px;
}

.brand-icon{
    width:30px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:#10a37f;

    color:white;
    font-size:16px;
}

.new-chat{
    height:46px;

    display:flex;
    align-items:center;
    gap:10px;

    padding:0 14px;

    border:
        1px solid #3d3d3d;

    background:transparent;
    color:#fff;

    border-radius:8px;

    cursor:pointer;

    font-size:14px;

    transition:.15s;
}

.new-chat:hover{
    background:#2a2a2a;
}

.history-title{
    color:#777;
    font-size:11px;

    padding:
        20px 10px 8px;
}

.history{
    flex:1;
    overflow-y:auto;
}

.history-item{
    width:100%;

    padding:
        10px 12px;

    margin-bottom:2px;

    border-radius:7px;

    color:#c8c8c8;

    font-size:13px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    cursor:pointer;
}

.history-item:hover{
    background:#2a2a2a;
}

.sidebar-bottom{
    border-top:
        1px solid #303030;

    padding-top:10px;

    color:#777;

    font-size:11px;

    text-align:center;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;

    height:100%;

    display:flex;
    flex-direction:column;

    min-width:0;
}

/* =========================
   HEADER
========================= */

.header{
    height:60px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        0 22px;

    border-bottom:
        1px solid rgba(255,255,255,.06);

    background:
        rgba(33,33,33,.92);

    backdrop-filter:blur(10px);
}

.model-name{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:14px;
    font-weight:bold;
}

.model-arrow{
    color:#888;
    font-size:12px;
}

.header-status{
    color:#777;
    font-size:11px;
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;

    overflow-y:auto;

    scroll-behavior:smooth;

    padding:
        30px 20px 150px;
}

/* scrollbar */

.chat::-webkit-scrollbar,
.history::-webkit-scrollbar{
    width:6px;
}

.chat::-webkit-scrollbar-thumb,
.history::-webkit-scrollbar-thumb{
    background:#454545;
    border-radius:10px;
}

/* =========================
   WELCOME
========================= */

.welcome{
    max-width:760px;

    margin:
        15vh auto 0;

    text-align:center;
}

.welcome-logo{
    width:58px;
    height:58px;

    margin:
        0 auto 20px;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#10a37f;

    font-size:27px;

    box-shadow:
        0 10px 40px
        rgba(16,163,127,.12);
}

.welcome h1{
    margin:0;

    font-size:30px;

    font-weight:600;
}

.welcome p{
    margin-top:12px;

    color:#999;

    font-size:14px;
}

/* =========================
   MESSAGE
========================= */

.message{
    width:100%;
    max-width:850px;

    margin:
        0 auto 28px;

    display:flex;

    gap:14px;

    align-items:flex-start;
}

.avatar{
    flex-shrink:0;

    width:30px;
    height:30px;

    border-radius:7px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:15px;

    background:#10a37f;
}

.user .avatar{
    background:#444;
}

.bubble{
    min-width:0;

    max-width:calc(100% - 44px);

    line-height:1.85;

    font-size:14px;

    color:#ececec;

    overflow-wrap:anywhere;
}

.user .bubble{
    background:#2f2f2f;

    padding:
        10px 14px;

    border-radius:
        12px;

    border:
        1px solid #3b3b3b;
}

/* =========================
   MARKDOWN
========================= */

.bubble h1,
.bubble h2,
.bubble h3{
    margin-top:22px;
}

.bubble p{
    margin:
        8px 0;
}

.bubble ul,
.bubble ol{
    padding-right:22px;
}

.bubble a{
    color:#58a6ff;
}

.bubble blockquote{
    border-right:
        3px solid #555;

    margin:
        15px 0;

    padding-right:14px;

    color:#aaa;
}

/* =========================
   CODE
========================= */

.code-container{
    position:relative;

    margin:
        16px 0;

    direction:ltr;
}

.code-container pre{
    margin:0;

    padding:
        42px 15px 15px;

    background:#0d0d0d;

    border:
        1px solid #333;

    border-radius:10px;

    overflow-x:auto;

    direction:ltr;

    text-align:left;
}

.code-container code{
    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size:13px;

    line-height:1.7;
}

.copy-code{
    position:absolute;

    top:8px;
    right:8px;

    border:
        1px solid #3d3d3d;

    background:#222;

    color:#bbb;

    padding:
        5px 10px;

    border-radius:6px;

    font-size:11px;

    cursor:pointer;
}

.copy-code:hover{
    background:#333;
    color:white;
}

/* =========================
   MEDIA
========================= */

.media-preview{
    display:block;

    max-width:100%;

    max-height:420px;

    margin-top:10px;

    border-radius:10px;

    border:
        1px solid #3a3a3a;
}

/* =========================
   TYPING
========================= */

.typing{
    display:flex;

    align-items:center;

    gap:5px;

    color:#888;

    font-size:13px;
}

.dot{
    width:5px;
    height:5px;

    border-radius:50%;

    background:#aaa;

    animation:
        blink 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.2s;
}

.dot:nth-child(3){
    animation-delay:.4s;
}

@keyframes blink{

    0%,100%{
        opacity:.25;
    }

    50%{
        opacity:1;
    }
}

/* =========================
   COMPOSER
========================= */

.composer-area{
    position:fixed;

    bottom:0;
    right:260px;
    left:0;

    padding:
        15px 20px 20px;

    background:
        linear-gradient(
            to top,
            #212121 65%,
            rgba(33,33,33,0)
        );
}

.composer{
    width:100%;
    max-width:850px;

    margin:auto;

    background:#2f2f2f;

    border:
        1px solid #4a4a4a;

    border-radius:16px;

    padding:8px;

    box-shadow:
        0 5px 30px
        rgba(0,0,0,.25);
}

.attachment{
    display:none;

    margin:
        0 8px 7px;

    padding:8px 10px;

    background:#242424;

    border-radius:8px;

    color:#aaa;

    font-size:11px;
}

.composer-row{
    display:flex;

    align-items:flex-end;

    gap:5px;
}

textarea{
    flex:1;

    min-height:42px;
    max-height:180px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:white;

    font-family:inherit;

    font-size:14px;

    line-height:1.6;

    padding:
        9px 8px;
}

textarea::placeholder{
    color:#888;
}

.tool-btn{
    width:38px;
    height:38px;

    flex-shrink:0;

    border:0;

    border-radius:9px;

    background:transparent;

    color:#aaa;

    font-size:18px;

    cursor:pointer;
}

.tool-btn:hover{
    background:#3b3b3b;
    color:#fff;
}

.send-btn{
    width:38px;
    height:38px;

    border:0;

    border-radius:9px;

    background:#fff;

    color:#111;

    cursor:pointer;

    font-size:17px;

    transition:.15s;
}

.send-btn:hover{
    transform:scale(1.04);
}

.send-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.bottom-note{
    max-width:850px;

    margin:
        7px auto 0;

    text-align:center;

    color:#777;

    font-size:10px;
}

/* =========================
   MOBILE
========================= */

.mobile-menu{
    display:none;
}

@media(max-width:800px){

    .sidebar{
        display:none;
    }

    .composer-area{
        right:0;
    }

    .chat{
        padding:
            20px 12px 140px;
    }

    .message{
        gap:9px;
    }

    .bubble{
        font-size:13px;
    }

    .welcome{
        margin-top:12vh;
    }

    .welcome h1{
        font-size:25px;
    }

}

</style>

</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                ✦
            </div>

            <span>
                BEHRAD AI
            </span>

        </div>


        <button
            class="new-chat"
            onclick="newChat()"
        >

            <span>＋</span>

            <span>
                گفتگوی جدید
            </span>

        </button>


        <div class="history-title">
            گفتگوها
        </div>


        <div
            id="history"
            class="history"
        ></div>


        <div class="sidebar-bottom">
            BEHRAD AI
            <br>
            Space Bunny Alpha
        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <header class="header">

            <div class="model-name">

                <span>
                    Space Bunny Alpha
                </span>

                <span class="model-arrow">
                    ▾
                </span>

            </div>


            <div
                id="headerStatus"
                class="header-status"
            >
                آماده
            </div>

        </header>


        <!-- CHAT -->

        <section
            id="chat"
            class="chat"
        ></section>


        <!-- COMPOSER -->

        <div class="composer-area">

            <div
                id="attachment"
                class="attachment"
            ></div>


            <div class="composer">

                <div class="composer-row">


                    <input
                        id="fileInput"
                        type="file"
                        hidden
                        accept="image/*,video/*"
                    >


                    <button
                        id="attachBtn"
                        class="tool-btn"
                        title="آپلود عکس یا ویدئو"
                    >
                        ＋
                    </button>


                    <textarea
                        id="input"
                        rows="1"
                        placeholder="پیامی برای BEHRAD AI بنویس..."
                    ></textarea>


                    <button
                        id="sendBtn"
                        class="send-btn"
                        title="ارسال"
                    >
                        ↑
                    </button>

                </div>

            </div>


            <div class="bottom-note">
                BEHRAD AI ممکن است اشتباه کند؛ اطلاعات مهم را بررسی کنید.
            </div>

        </div>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>


<script>

/* =========================================
   CONFIG
========================================= */

const API = window.location.origin;

const STORAGE_KEY =
    "behrad_ai_professional_v1";

const MAX_HISTORY = 20;

const MAX_IMAGE_MB = 15;

const MAX_VIDEO_MB = 20;


/* =========================================
   STATE
========================================= */

let messages = [];

let selectedFile = null;

let sending = false;


/* =========================================
   ELEMENTS
========================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("input");

const sendBtn =
    document.getElementById("sendBtn");

const attachBtn =
    document.getElementById("attachBtn");

const fileInput =
    document.getElementById("fileInput");

const attachment =
    document.getElementById("attachment");

const history =
    document.getElementById("history");

const headerStatus =
    document.getElementById("headerStatus");


/* =========================================
   LOAD
========================================= */

try{

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if(saved){

        const parsed =
            JSON.parse(saved);

        if(Array.isArray(parsed)){

            messages =
                parsed
                .filter(
                    m =>
                        m &&
                        (
                            m.role === "user" ||
                            m.role === "assistant"
                        )
                )
                .map(m => ({
                    role:m.role,
                    content:
                        typeof m.content === "string"
                            ? m.content
                            : extractText(m.content)
                }));

        }

    }

}catch{

    messages = [];

}


/* =========================================
   HELPERS
========================================= */

function extractText(content){

    if(typeof content === "string"){
        return content;
    }

    if(!Array.isArray(content)){
        return "";
    }

    return content
        .filter(
            part =>
                part &&
                part.type === "text"
        )
        .map(
            part =>
                part.text || ""
        )
        .join("\n");
}


function save(){

    const safe =
        messages.map(m => ({
            role:m.role,
            content:extractText(m.content)
        }));

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(safe)
    );
}


function setStatus(text){

    headerStatus.textContent = text;
}


/* =========================================
   WELCOME
========================================= */

function showWelcome(){

    chat.innerHTML = `

        <div class="welcome">

            <div class="welcome-logo">
                ✦
            </div>

            <h1>
                با BEHRAD AI شروع کن
            </h1>

            <p>
                سؤال بپرس، کد بنویس، عکس بفرست و ایده‌هات رو تبدیل به واقعیت کن.
            </p>

        </div>

    `;
}


/* =========================================
   RENDER
========================================= */

function render(){

    if(!messages.length){

        showWelcome();

        renderHistory();

        return;
    }


    chat.innerHTML = "";


    messages.forEach(message => {

        const row =
            document.createElement("div");

        row.className =
            "message " +
            (
                message.role === "user"
                    ? "user"
                    : "assistant"
            );


        const avatar =
            document.createElement("div");

        avatar.className =
            "avatar";

        avatar.textContent =
            message.role === "user"
                ? "👤"
                : "✦";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";


        if(message.role === "user"){

            bubble.textContent =
                extractText(
                    message.content
                );

        }else{

            let html = "";

            try{

                html =
                    marked.parse(
                        String(
                            message.content || ""
                        )
                    );

            }catch{

                html =
                    String(
                        message.content || ""
                    );

            }


            bubble.innerHTML =
                DOMPurify.sanitize(
                    html
                );

            decorateCode(
                bubble
            );

        }


        row.appendChild(avatar);

        row.appendChild(bubble);

        chat.appendChild(row);

    });


    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });


    renderHistory();
}


/* =========================================
   CODE BUTTONS
========================================= */

function decorateCode(container){

    const blocks =
        container.querySelectorAll("pre");


    blocks.forEach(pre => {

        if(
            pre.parentElement.classList.contains(
                "code-container"
            )
        ){
            return;
        }


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "code-container";


        pre.parentNode.insertBefore(
            wrapper,
            pre
        );

        wrapper.appendChild(pre);


        const button =
            document.createElement("button");

        button.className =
            "copy-code";

        button.textContent =
            "کپی";


        button.onclick =
            async () => {

                const code =
                    pre.querySelector("code")
                    ?.innerText ||
                    pre.innerText;


                try{

                    await navigator.clipboard
                        .writeText(code);

                    button.textContent =
                        "✓ کپی شد";


                    setTimeout(
                        () => {
                            button.textContent =
                                "کپی";
                        },
                        1500
                    );

                }catch{

                    button.textContent =
                        "خطا";

                }

            };


        wrapper.appendChild(
            button
        );

    });

}


/* =========================================
   HISTORY
========================================= */

function renderHistory(){

    history.innerHTML = "";


    const items =
        messages
        .filter(
            m =>
                m.role === "user"
        )
        .slice(-30)
        .reverse();


    items.forEach(message => {

        const item =
            document.createElement("div");

        item.className =
            "history-item";


        const text =
            extractText(
                message.content
            );


        item.textContent =
            text.slice(0,60) ||
            "گفتگو";


        item.onclick = () => {

            const target =
                [...chat.children]
                .find(
                    el =>
                        el.classList.contains(
                            "message"
                        ) &&
                        el.querySelector(
                            ".bubble"
                        )?.textContent
                        .includes(text.slice(0,30))
                );


            if(target){

                target.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            }

        };


        history.appendChild(item);

    });

}


/* =========================================
   ATTACHMENT
========================================= */

attachBtn.onclick = () => {

    fileInput.click();

};


fileInput.onchange = () => {

    const file =
        fileInput.files[0];


    if(!file){

        selectedFile = null;

        attachment.style.display =
            "none";

        return;
    }


    const isImage =
        file.type.startsWith(
            "image/"
        );


    const isVideo =
        file.type.startsWith(
            "video/"
        );


    if(!isImage && !isVideo){

        alert(
            "فقط عکس یا ویدئو قابل انتخاب است."
        );

        fileInput.value = "";

        return;
    }


    const max =
        isImage
            ? MAX_IMAGE_MB
            : MAX_VIDEO_MB;


    if(
        file.size >
        max * 1024 * 1024
    ){

        alert(
            `حجم ${isImage ? "عکس" : "ویدئو"} نباید بیشتر از ${max}MB باشد.`
        );

        fileInput.value = "";

        selectedFile = null;

        attachment.style.display =
            "none";

        return;
    }


    selectedFile = file;


    attachment.style.display =
        "block";


    attachment.textContent =
        `${isImage ? "🖼️" : "🎬"} ${file.name} — ${formatBytes(file.size)}`;

};


function formatBytes(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }

    if(bytes < 1024 * 1024){

        return (
            bytes / 1024
        ).toFixed(1) + " KB";

    }

    return (
        bytes /
        1024 /
        1024
    ).toFixed(1) + " MB";
}


/* =========================================
   READ FILE
========================================= */

function readFile(file){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => {

                    resolve(
                        reader.result
                    );

                };


            reader.onerror =
                () => {

                    reject(
                        new Error(
                            "خواندن فایل انجام نشد."
                        )
                    );

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =========================================
   BUILD API MESSAGES
========================================= */

function buildApiMessages(
    currentMessage
){

    const result = [];


    messages
    .slice(-MAX_HISTORY)
    .forEach(
        (message,index,array) => {

            const current =
                message === currentMessage &&
                index === array.length - 1;


            /*
                فقط پیام فعلی فایل دارد.
                فایل‌های قدیمی دوباره ارسال نمی‌شوند.
            */

            if(current){

                result.push({
                    role:message.role,
                    content:message.content
                });

            }else{

                result.push({
                    role:message.role,
                    content:
                        extractText(
                            message.content
                        )
                });

            }

        }
    );


    return result;

}


/* =========================================
   API
========================================= */

async function askAI(
    apiMessages
){

    let response;


    try{

        response =
            await fetch(
                `${API}/api/chat`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        messages:
                            apiMessages
                    })
                }
            );

    }catch{

        throw new Error(
            "ارتباط با سرور برقرار نشد."
        );

    }


    const text =
        await response.text();


    let data;


    try{

        data =
            JSON.parse(text);

    }catch{

        throw new Error(
            `سرور پاسخ نامعتبر داد. HTTP ${response.status}`
        );

    }


    if(
        !response.ok ||
        data.success === false
    ){

        throw new Error(
            data.error ||
            `خطای سرور: HTTP ${response.status}`
        );

    }


    return data;

}


/* =========================================
   SEND
========================================= */

async function sendMessage(){

    if(sending){
        return;
    }


    const text =
        input.value.trim();


    if(
        !text &&
        !selectedFile
    ){
        return;
    }


    sending = true;

    sendBtn.disabled =
        true;


    setStatus(
        "در حال فکر کردن..."
    );


    try{

        let content;


        /*
            چت معمولی:
            کاملاً ساده و پایدار.
        */

        if(!selectedFile){

            content =
                text;

        }else{

            const file =
                selectedFile;


            const isImage =
                file.type.startsWith(
                    "image/"
                );


            const isVideo =
                file.type.startsWith(
                    "video/"
                );


            if(isVideo){

                /*
                    فعلاً ویدئو را داخل API نمی‌فرستیم
                    تا باعث خطای مدل نشود.

                    خود ویدئو در UI نمایش داده می‌شود
                    و پیام به AI توضیح می‌دهد که فایل
                    انتخاب شده است.
                */

                content =
                    text
                    ? `${text}\n\n[ویدئو پیوست شد: ${file.name}]`
                    : `ویدئو پیوست شد: ${file.name}`;

            }else if(isImage){

                const dataURL =
                    await readFile(file);


                content = [

                    {
                        type:"text",

                        text:
                            text ||
                            "این تصویر را بررسی کن و توضیح بده."
                    },

                    {
                        type:"image_url",

                        image_url:{
                            url:dataURL
                        }
                    }

                ];

            }else{

                throw new Error(
                    "فرمت فایل پشتیبانی نمی‌شود."
                );

            }

        }


        const userMessage = {

            role:"user",

            content:content

        };


        messages.push(
            userMessage
        );


        render();


        input.value = "";

        input.style.height =
            "auto";


        selectedFile = null;

        fileInput.value = "";

        attachment.style.display =
            "none";


        const apiMessages =
            buildApiMessages(
                userMessage
            );


        const data =
            await askAI(
                apiMessages
            );


        messages.push({

            role:"assistant",

            content:
                data.reply

        });


        save();

        render();

        setStatus(
            "آماده"
        );


    }catch(error){

        console.error(error);


        messages.push({

            role:"assistant",

            content:
                `❌ ${error.message}`

        });


        render();


        setStatus(
            "خطا"
        );

    }finally{

        sending = false;

        sendBtn.disabled =
            false;

    }

}


/* =========================================
   NEW CHAT
========================================= */

function newChat(){

    messages = [];

    selectedFile = null;

    input.value = "";

    fileInput.value = "";

    attachment.style.display =
        "none";

    localStorage.removeItem(
        STORAGE_KEY
    );

    setStatus(
        "آماده"
    );

    render();

}


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   AUTO RESIZE
========================================= */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                180
            ) + "px";

    }
);


/* =========================================
   START
========================================= */

render();

</script>
