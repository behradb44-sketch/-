<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEHRAD AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at top right, #102044 0%, transparent 35%),
                radial-gradient(circle at bottom left, #300c18 0%, transparent 35%),
                #05070d;

            color: white;
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;
        }

        button,
        textarea,
        input {
            font-family: inherit;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            background: rgba(5, 8, 17, 0.95);
            border-left: 1px solid rgba(255,255,255,.08);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            padding: 15px;
            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,174,255,.18),
                    rgba(255,30,70,.18)
                );

            border: 1px solid rgba(255,255,255,.08);
            text-align: center;

            box-shadow:
                0 0 25px rgba(0,150,255,.08);
        }

        .new-chat {
            border: none;
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            background: linear-gradient(135deg,#087cff,#ff164c);
            transition: .2s;
        }

        .new-chat:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,100,255,.2);
        }

        .model-box {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.06);
            padding: 13px;
            border-radius: 14px;
            font-size: 13px;
            color: #b9c7dc;
        }

        .history-title {
            color: #8494ad;
            font-size: 12px;
            margin-top: 10px;
        }

        .history {
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            margin-bottom: 7px;
            border-radius: 10px;
            background: rgba(255,255,255,.03);
            color: #dce4f1;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: rgba(255,255,255,.07);
        }

        /* MAIN */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 68px;
            border-bottom: 1px solid rgba(255,255,255,.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            background: rgba(5,7,13,.7);
            backdrop-filter: blur(15px);
        }

        .status {
            color: #58ff9c;
            font-size: 13px;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 35px 8%;
        }

        .welcome {
            max-width: 850px;
            margin: 70px auto;
            text-align: center;
        }

        .welcome h1 {
            font-size: 48px;
            margin: 0 0 15px;
            background: linear-gradient(90deg,#27a9ff,#ff315b);
            -webkit-background-clip: text;
            color: transparent;
        }

        .welcome p {
            color: #8f9cb2;
        }

        .message {
            max-width: 900px;
            margin: 0 auto 22px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .avatar {
            min-width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,#168dff,#ff1f50);
            font-size: 18px;
        }

        .bubble {
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.06);
            padding: 15px 17px;
            border-radius: 16px;
            line-height: 1.9;
            max-width: min(850px, 90%);
            overflow-wrap: anywhere;
        }

        .user .bubble {
            background: rgba(0,120,255,.10);
        }

        .bubble pre {
            direction: ltr;
            text-align: left;
            background: #02040a;
            border: 1px solid rgba(255,255,255,.08);
            padding: 14px;
            border-radius: 12px;
            overflow-x: auto;
            position: relative;
        }

        .bubble code {
            font-family: Consolas, monospace;
        }

        .code-wrap {
            position: relative;
        }

        .copy-code {
            position: absolute;
            top: 8px;
            left: 8px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.07);
            color: white;
            border-radius: 8px;
            padding: 5px 9px;
            cursor: pointer;
            font-size: 11px;
        }

        .copy-code:hover {
            background: rgba(0,150,255,.25);
        }

        .media-preview {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 12px;
        }

        .composer {
            padding: 15px 8% 22px;
            background: linear-gradient(
                to top,
                #05070d 70%,
                transparent
            );
        }

        .composer-box {
            max-width: 900px;
            margin: auto;
            display: flex;
            align-items: flex-end;
            gap: 8px;

            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.09);
            padding: 10px;
            border-radius: 18px;
            backdrop-filter: blur(15px);
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            min-height: 48px;
            max-height: 180px;
            padding: 12px;
            font-size: 15px;
        }

        textarea::placeholder {
            color: #66748c;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 13px;
            background: rgba(255,255,255,.07);
            color: white;
            cursor: pointer;
            font-size: 20px;
        }

        .icon-btn:hover {
            background: rgba(0,140,255,.2);
        }

        .send {
            background: linear-gradient(135deg,#087cff,#e91d4d);
        }

        #fileInput {
            display: none;
        }

        .attachment {
            max-width: 900px;
            margin: 8px auto 0;
            color: #8ea0b9;
            font-size: 12px;
        }

        .typing {
            color: #75839a;
            font-size: 13px;
        }

        @media(max-width:800px) {
            .sidebar {
                display: none;
            }

            .chat,
            .composer {
                padding-left: 12px;
                padding-right: 12px;
            }

            .welcome h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            🤖 BEHRAD AI
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ گفتگوی جدید
        </button>

        <div class="model-box">
            🧠 مدل:
            <br>
            <b>Space Bunny Alpha</b>
        </div>

        <div class="history-title">
            تاریخچه گفتگو
        </div>

        <div id="history" class="history"></div>

    </aside>


    <main class="main">

        <div class="topbar">
            <b>BEHRAD AI</b>

            <div id="status" class="status">
                ● آماده
            </div>
        </div>


        <div id="chat" class="chat">

            <div class="welcome" id="welcome">

                <h1>BEHRAD AI</h1>

                <p>
                    سلام رفیق 👋
                    هرچی می‌خوای بپرس.
                </p>

                <p>
                    💻 کدنویسی • 🧠 سؤال • 🌐 وب • 🖼️ عکس • 🎬 ویدئو
                </p>

            </div>

        </div>


        <div class="composer">

            <div id="attachmentInfo" class="attachment"></div>

            <div class="composer-box">

                <input
                    id="fileInput"
                    type="file"
                    accept="image/*,video/*"
                >

                <button
                    class="icon-btn"
                    onclick="document.getElementById('fileInput').click()"
                    title="آپلود عکس یا ویدئو"
                >
                    📎
                </button>

                <textarea
                    id="input"
                    placeholder="پیامت رو بنویس..."
                    rows="1"
                ></textarea>

                <button
                    class="icon-btn send"
                    onclick="sendMessage()"
                    title="ارسال"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<script>

const API = window.location.origin;

/*
    نسخه جدید ذخیره‌سازی.
    تاریخچه خراب نسخه قبلی را عمداً نمی‌خوانیم.
*/
const STORAGE_KEY = "behrad_ai_messages_v5";

let messages = [];
let selectedFile = null;
let sending = false;


/* -----------------------------
   ELEMENTS
----------------------------- */

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const statusEl = document.getElementById("status");
const historyEl = document.getElementById("history");
const fileInput = document.getElementById("fileInput");
const attachmentInfo = document.getElementById("attachmentInfo");


/* -----------------------------
   LOAD
----------------------------- */

try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
        const parsed = JSON.parse(saved);

        if (Array.isArray(parsed)) {
            messages = parsed
                .filter(m =>
                    m &&
                    (m.role === "user" || m.role === "assistant")
                )
                .map(m => ({
                    role: m.role,
                    content: typeof m.content === "string"
                        ? m.content
                        : extractText(m.content)
                }));
        }
    }
} catch (e) {
    messages = [];
}

render();


/* -----------------------------
   HELPERS
----------------------------- */

function extractText(content) {

    if (typeof content === "string") {
        return content;
    }

    if (!Array.isArray(content)) {
        return "";
    }

    return content
        .filter(x => x && x.type === "text")
        .map(x => x.text || "")
        .join("\n");
}


function save() {

    /*
        فقط متن ذخیره می‌شود.
        فایل‌های قبلی دوباره به OpenRouter ارسال نمی‌شوند.
    */

    const safe = messages.map(m => ({
        role: m.role,
        content: extractText(m.content)
    }));

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(safe)
    );
}


function setStatus(text, good = true) {

    statusEl.textContent = good
        ? "● " + text
        : "● " + text;

    statusEl.style.color = good
        ? "#58ff9c"
        : "#ff5577";
}


/* -----------------------------
   RENDER
----------------------------- */

function render() {

    if (!messages.length) {

        chat.innerHTML = `
            <div class="welcome" id="welcome">

                <h1>BEHRAD AI</h1>

                <p>
                    سلام رفیق 👋
                    هرچی می‌خوای بپرس.
                </p>

                <p>
                    💻 کدنویسی • 🧠 سؤال • 🌐 وب • 🖼️ عکس • 🎬 ویدئو
                </p>

            </div>
        `;

        renderHistory();
        return;
    }

    chat.innerHTML = "";

    messages.forEach(message => {

        const wrapper = document.createElement("div");

        wrapper.className =
            "message " +
            (message.role === "user" ? "user" : "assistant");

        const avatar = document.createElement("div");

        avatar.className = "avatar";

        avatar.textContent =
            message.role === "user"
                ? "👤"
                : "🤖";


        const bubble = document.createElement("div");

        bubble.className = "bubble";

        if (message.role === "assistant") {

            let html = "";

            try {
                html = marked.parse(
                    String(message.content || "")
                );
            } catch {
                html = String(message.content || "");
            }

            bubble.innerHTML = DOMPurify.sanitize(html);

            addCopyButtons(bubble);

        } else {

            bubble.textContent =
                extractText(message.content);

        }


        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);

        chat.appendChild(wrapper);

    });

    chat.scrollTop = chat.scrollHeight;

    renderHistory();
}


/* -----------------------------
   CODE COPY
----------------------------- */

function addCopyButtons(container) {

    const blocks = container.querySelectorAll("pre");

    blocks.forEach(pre => {

        if (pre.querySelector(".copy-code")) {
            return;
        }

        const button = document.createElement("button");

        button.className = "copy-code";
        button.textContent = "کپی";

        button.onclick = async () => {

            const code =
                pre.querySelector("code")?.innerText ||
                pre.innerText;

            try {

                await navigator.clipboard.writeText(code);

                button.textContent = "✓ کپی شد";

                setTimeout(() => {
                    button.textContent = "کپی";
                }, 1500);

            } catch {

                button.textContent = "خطا";
            }

        };

        pre.classList.add("code-wrap");

        pre.appendChild(button);

    });
}


/* -----------------------------
   HISTORY
----------------------------- */

function renderHistory() {

    historyEl.innerHTML = "";

    const userMessages = messages
        .filter(m => m.role === "user")
        .slice(-20)
        .reverse();

    userMessages.forEach(message => {

        const item = document.createElement("div");

        item.className = "history-item";

        item.textContent =
            extractText(message.content)
                .slice(0, 60) ||
            "گفتگو";

        item.onclick = () => {

            const index = messages.indexOf(message);

            if (index >= 0) {

                const element =
                    chat.children[index];

                if (element) {
                    element.scrollIntoView({
                        behavior: "smooth"
                    });
                }

            }

        };

        historyEl.appendChild(item);

    });
}


/* -----------------------------
   FILE
----------------------------- */

fileInput.addEventListener("change", () => {

    const file = fileInput.files[0];

    if (!file) {
        selectedFile = null;
        attachmentInfo.textContent = "";
        return;
    }

    const maxSize = 15 * 1024 * 1024;

    if (file.size > maxSize) {

        alert(
            "حجم فایل نباید بیشتر از ۱۵ مگابایت باشد."
        );

        fileInput.value = "";
        selectedFile = null;
        attachmentInfo.textContent = "";

        return;
    }

    selectedFile = file;

    attachmentInfo.textContent =
        `📎 ${file.name} — ${formatBytes(file.size)}`;
});


function formatBytes(bytes) {

    if (bytes < 1024) {
        return bytes + " B";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / 1024 / 1024).toFixed(1) + " MB";
}


/* -----------------------------
   FILE → DATA URL
----------------------------- */

function readFile(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = () =>
            reject(
                new Error("خواندن فایل انجام نشد.")
            );

        reader.readAsDataURL(file);
    });
}


/* -----------------------------
   API RESPONSE
----------------------------- */

async function readJSON(response) {

    const text = await response.text();

    let data;

    try {
        data = JSON.parse(text);
    } catch {

        throw new Error(
            `سرور پاسخ JSON نداد. HTTP ${response.status}`
        );
    }

    if (!response.ok || data.success === false) {

        let message =
            data.error ||
            data.message ||
            "خطای نامشخص سرور";

        if (data.details) {

            console.error(
                "Server details:",
                data.details
            );
        }

        throw new Error(
            `${message} — HTTP ${response.status}`
        );
    }

    return data;
}


/* -----------------------------
   BUILD API HISTORY
----------------------------- */

function buildApiMessages(currentMessage) {

    const result = [];

    /*
        نکته مهم:

        فقط پیام فعلی می‌تواند فایل داشته باشد.

        فایل‌های پیام‌های قدیمی دوباره ارسال نمی‌شوند.
        این جلوی خراب‌شدن درخواست‌های بعدی را می‌گیرد.
    */

    messages.slice(-20).forEach((message, index, array) => {

        const isCurrent =
            message === currentMessage &&
            index === array.length - 1;

        if (isCurrent) {

            result.push({
                role: message.role,
                content: message.content
            });

            return;
        }

        result.push({
            role: message.role,
            content: extractText(message.content)
        });

    });

    return result;
}


/* -----------------------------
   SEND
----------------------------- */

async function sendMessage() {

    if (sending) {
        return;
    }

    const text = input.value.trim();

    if (!text && !selectedFile) {
        return;
    }

    sending = true;

    setStatus("در حال فکر کردن...");

    try {

        let content;

        /*
            حالت عادی:
            دقیقاً مثل نسخه اول.
        */

        if (!selectedFile) {

            content = text;

        } else {

            /*
                حالت عکس/ویدئو:
                فایل مستقیم به صورت data URL
                داخل همان درخواست chat می‌رود.
            */

            const dataURL =
                await readFile(selectedFile);

            const parts = [];

            if (text) {

                parts.push({
                    type: "text",
                    text: text
                });

            } else {

                parts.push({
                    type: "text",
                    text:
                        selectedFile.type.startsWith("image/")
                            ? "این تصویر را بررسی کن."
                            : "این ویدئو را بررسی کن."
                });

            }


            if (selectedFile.type.startsWith("image/")) {

                parts.push({
                    type: "image_url",
                    image_url: {
                        url: dataURL
                    }
                });

            } else if (
                selectedFile.type.startsWith("video/")
            ) {

                parts.push({
                    type: "video_url",
                    video_url: {
                        url: dataURL
                    }
                });

            } else {

                throw new Error(
                    "این نوع فایل پشتیبانی نمی‌شود."
                );
            }

            content = parts;
        }


        const userMessage = {
            role: "user",
            content: content
        };

        messages.push(userMessage);

        render();


        input.value = "";

        selectedFile = null;

        fileInput.value = "";

        attachmentInfo.textContent = "";


        const apiMessages =
            buildApiMessages(userMessage);


        /*
            درخواست اصلی.
            فقط /api/chat.
        */

        let response;

        try {

            response = await fetch(
                `${API}/api/chat`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        messages: apiMessages
                    })
                }
            );

        } catch (networkError) {

            throw new Error(
                "ارتباط با سرور برقرار نشد. اینترنت یا Render را بررسی کن."
            );
        }


        const data =
            await readJSON(response);


        if (!data.reply) {

            throw new Error(
                "سرور پاسخ متنی برنگرداند."
            );
        }


        messages.push({
            role: "assistant",
            content: data.reply
        });


        save();

        render();

        setStatus("آماده");

    } catch (error) {

        console.error(error);

        /*
            پیام خطا فقط داخل همان چت نمایش داده می‌شود.
            دیگر خطای آپلود را برای چت معمولی نشان نمی‌دهیم.
        */

        messages.push({
            role: "assistant",
            content:
                `❌ ${error.message}`
        });

        render();

        setStatus("خطا", false);

    } finally {

        sending = false;
    }
}


/* -----------------------------
   NEW CHAT
----------------------------- */

function newChat() {

    messages = [];

    selectedFile = null;

    input.value = "";

    fileInput.value = "";

    attachmentInfo.textContent = "";

    localStorage.removeItem(
        STORAGE_KEY
    );

    setStatus("آماده");

    render();
}


/* -----------------------------
   ENTER
----------------------------- */

input.addEventListener("keydown", event => {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }

});


/* -----------------------------
   AUTO RESIZE
----------------------------- */

input.addEventListener("input", () => {

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            180
        ) + "px";

});

</script>

</body>
</html>
