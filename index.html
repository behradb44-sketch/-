<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BEHRAD AI</title>


<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>


<style>

*{
    box-sizing:border-box;
}


html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#212121;
    color:#ececec;
    font-family:
        Tahoma,
        Arial,
        sans-serif;
}


body{
    overflow:hidden;
}


/* =====================================================
   APP
===================================================== */

.app{
    display:flex;
    width:100%;
    height:100vh;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    width:260px;
    min-width:260px;
    background:#171717;
    border-left:1px solid #2b2b2b;
    display:flex;
    flex-direction:column;
    padding:14px;
}


.logo{
    font-size:20px;
    font-weight:bold;
    padding:12px 10px 18px;
}


.logo span{
    color:#10a37f;
}


.new-chat{
    width:100%;
    border:1px solid #444;
    background:#212121;
    color:#fff;
    border-radius:8px;
    padding:11px;
    cursor:pointer;
    text-align:right;
    font-size:14px;
}


.new-chat:hover{
    background:#2a2a2a;
}


.history-title{
    margin-top:24px;
    margin-bottom:8px;
    color:#999;
    font-size:12px;
}


.history{
    flex:1;
    overflow-y:auto;
}


.history-item{
    padding:10px;
    border-radius:7px;
    color:#ccc;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


.history-item:hover{
    background:#2a2a2a;
}


/* =====================================================
   MAIN
===================================================== */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#212121;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:58px;
    min-height:58px;
    border-bottom:1px solid #303030;
    display:flex;
    align-items:center;
    padding:0 22px;
    background:#212121;
}


.model-name{
    font-size:15px;
    font-weight:bold;
}


.model-status{
    margin-right:10px;
    color:#777;
    font-size:12px;
}


.status-dot{
    width:7px;
    height:7px;
    display:inline-block;
    border-radius:50%;
    background:#10a37f;
    margin-left:5px;
}


/* =====================================================
   CHAT
===================================================== */

.chat{
    flex:1;
    overflow-y:auto;
    padding:30px 18px 180px;
}


.chat-inner{
    width:min(850px, 100%);
    margin:auto;
}


.welcome{
    text-align:center;
    margin-top:14vh;
}


.welcome h1{
    font-size:30px;
    margin-bottom:12px;
}


.welcome p{
    color:#999;
    font-size:14px;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{
    display:flex;
    gap:14px;
    margin-bottom:30px;
    line-height:1.9;
}


.avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:bold;
}


.message.user .avatar{
    background:#444;
}


.message.assistant .avatar{
    background:#10a37f;
    color:#fff;
}


.message-content{
    flex:1;
    min-width:0;
    font-size:15px;
    overflow-wrap:anywhere;
}


.message.user .message-content{
    background:#2f2f2f;
    padding:10px 14px;
    border-radius:12px;
}


.message.assistant .message-content{
    padding-top:2px;
}


/* =====================================================
   MARKDOWN
===================================================== */

.message-content p{
    margin:0 0 12px;
}


.message-content p:last-child{
    margin-bottom:0;
}


.message-content ul,
.message-content ol{
    padding-right:25px;
}


.message-content pre{
    direction:ltr;
    text-align:left;
    background:#111;
    border:1px solid #333;
    border-radius:8px;
    padding:16px;
    overflow-x:auto;
}


.message-content code{
    font-family:
        Consolas,
        monospace;
}


.message-content :not(pre) > code{
    background:#303030;
    padding:2px 6px;
    border-radius:5px;
}


/* =====================================================
   CODE COPY
===================================================== */

.code-box{
    position:relative;
    margin:12px 0;
}


.copy-code{
    position:absolute;
    top:8px;
    left:8px;
    border:1px solid #444;
    background:#222;
    color:#ddd;
    border-radius:6px;
    padding:5px 9px;
    cursor:pointer;
    font-size:11px;
}


.copy-code:hover{
    background:#333;
}


/* =====================================================
   THINKING
===================================================== */

.thinking{
    display:flex;
    flex-direction:column;
    gap:9px;
    width:190px;
}


.thinking-label{
    color:#aaa;
    font-size:13px;
}


.wave{
    height:28px;
    display:flex;
    align-items:center;
    gap:3px;
}


.wave span{
    display:block;
    width:3px;
    height:7px;
    border-radius:5px;
    background:#10a37f;
    animation:wave 1s ease-in-out infinite;
}


.wave span:nth-child(1){animation-delay:0s}
.wave span:nth-child(2){animation-delay:.08s}
.wave span:nth-child(3){animation-delay:.16s}
.wave span:nth-child(4){animation-delay:.24s}
.wave span:nth-child(5){animation-delay:.32s}
.wave span:nth-child(6){animation-delay:.40s}
.wave span:nth-child(7){animation-delay:.48s}
.wave span:nth-child(8){animation-delay:.56s}
.wave span:nth-child(9){animation-delay:.64s}
.wave span:nth-child(10){animation-delay:.72s}
.wave span:nth-child(11){animation-delay:.80s}
.wave span:nth-child(12){animation-delay:.88s}


@keyframes wave{

    0%,
    100%{
        height:6px;
        opacity:.45;
    }

    50%{
        height:25px;
        opacity:1;
    }

}


/* =====================================================
   SEARCH STATUS
===================================================== */

.search-status{
    display:none;
    align-items:center;
    gap:9px;
    background:#292929;
    border:1px solid #3a3a3a;
    border-radius:9px;
    padding:9px 12px;
    margin-bottom:12px;
    color:#aaa;
    font-size:12px;
}


.search-icon{
    color:#10a37f;
    font-size:15px;
}


.search-status.active{
    display:flex;
}


/* =====================================================
   COMPOSER
===================================================== */

.composer-area{
    position:absolute;
    bottom:0;
    right:260px;
    left:0;
    padding:15px 18px 22px;
    background:
        linear-gradient(
            to top,
            #212121 65%,
            transparent
        );
}


.composer{
    width:min(850px, 100%);
    margin:auto;
    position:relative;
}


.composer-box{
    background:#2f2f2f;
    border:1px solid #454545;
    border-radius:15px;
    padding:12px 50px 12px 52px;
    box-shadow:
        0 5px 25px rgba(0,0,0,.25);
}


textarea{
    width:100%;
    min-height:28px;
    max-height:180px;
    resize:none;
    border:0;
    outline:none;
    background:transparent;
    color:#fff;
    font-family:inherit;
    font-size:14px;
    line-height:1.7;
}


textarea::placeholder{
    color:#888;
}


.send{
    position:absolute;
    left:10px;
    bottom:10px;
    width:34px;
    height:34px;
    border:0;
    border-radius:8px;
    background:#10a37f;
    color:white;
    cursor:pointer;
    font-size:16px;
}


.send:hover{
    background:#0e8f70;
}


.send:disabled{
    opacity:.45;
    cursor:not-allowed;
}


.attach{
    position:absolute;
    right:9px;
    bottom:10px;
    width:34px;
    height:34px;
    border:0;
    background:transparent;
    color:#aaa;
    cursor:pointer;
    font-size:20px;
}


.attach:hover{
    color:#fff;
}


#fileInput{
    display:none;
}


.file-preview{
    display:none;
    margin-bottom:8px;
    background:#2b2b2b;
    border:1px solid #444;
    border-radius:9px;
    padding:8px 11px;
    color:#bbb;
    font-size:12px;
}


.file-preview.active{
    display:block;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .sidebar{
        display:none;
    }

    .composer-area{
        right:0;
    }

    .chat{
        padding-left:12px;
        padding-right:12px;
    }

    .welcome h1{
        font-size:25px;
    }

    .message-content{
        font-size:14px;
    }

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{
    width:7px;
}


::-webkit-scrollbar-track{
    background:transparent;
}


::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:10px;
}


::-webkit-scrollbar-thumb:hover{
    background:#555;
}

</style>

</head>


<body>


<div class="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            BEHRAD <span>AI</span>
        </div>


        <button
            class="new-chat"
            onclick="newChat()"
        >
            ＋ چت جدید
        </button>


        <div class="history-title">
            تاریخچه
        </div>


        <div
            id="history"
            class="history"
        ></div>

    </aside>



    <!-- MAIN -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">

            <div>

                <span class="model-name">
                    Space Bunny Alpha
                </span>

                <span class="model-status">

                    <span class="status-dot"></span>

                    آنلاین

                </span>

            </div>

        </header>



        <!-- CHAT -->

        <section
            id="chat"
            class="chat"
        >

            <div
                id="chatInner"
                class="chat-inner"
            >

                <div
                    id="welcome"
                    class="welcome"
                >

                    <h1>
                        BEHRAD AI
                    </h1>

                    <p>
                        سلام بهراد 👋
                        هرچی می‌خوای بپرس.
                    </p>

                </div>

            </div>

        </section>



        <!-- COMPOSER -->

        <div class="composer-area">

            <div class="composer">


                <div
                    id="filePreview"
                    class="file-preview"
                ></div>


                <div class="composer-box">

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="پیامت رو بنویس..."
                    ></textarea>


                    <button
                        id="attachButton"
                        class="attach"
                        title="افزودن فایل"
                    >
                        ＋
                    </button>


                    <button
                        id="sendButton"
                        class="send"
                        title="ارسال"
                    >
                        ↑
                    </button>

                </div>


                <input
                    id="fileInput"
                    type="file"
                    accept="image/*,video/*"
                >

            </div>

        </div>

    </main>

</div>



<script>

/* =====================================================
   CONFIG
===================================================== */

const API_STREAM =
    "/api/chat/stream";

const API_NORMAL =
    "/api/chat";


const STORAGE_KEY =
    "behrad_ai_professional_v3";


const MAX_HISTORY =
    12;


/* =====================================================
   STATE
===================================================== */

let messages = [];

let selectedFile = null;

let isSending = false;


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const welcome =
    document.getElementById("welcome");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const attachButton =
    document.getElementById("attachButton");

const fileInput =
    document.getElementById("fileInput");

const filePreview =
    document.getElementById("filePreview");

const historyElement =
    document.getElementById("history");


/* =====================================================
   LOAD
===================================================== */

load();

renderHistory();


/* =====================================================
   LOAD STORAGE
===================================================== */

function load(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(saved){

            const parsed =
                JSON.parse(saved);


            if(Array.isArray(parsed)){

                messages =
                    parsed.slice(
                        -MAX_HISTORY
                    );

            }

        }

    }catch(error){

        console.error(
            "History load error:",
            error
        );

        messages = [];

    }


    renderAll();
}


/* =====================================================
   SAVE
===================================================== */

function save(){

    try{

        const clean =
            messages
                .slice(-MAX_HISTORY)
                .map(message => {

                    return {
                        role:message.role,
                        content:
                            typeof message.content === "string"
                                ? message.content
                                : "[رسانه پیوست شد]"
                    };

                });


        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(clean)
        );


    }catch(error){

        console.error(
            "Save error:",
            error
        );

    }

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

    messages = [];

    selectedFile = null;

    localStorage.removeItem(
        STORAGE_KEY
    );

    clearFile();

    renderAll();

    input.focus();
}


/* =====================================================
   RENDER ALL
===================================================== */

function renderAll(){

    chatInner.innerHTML = "";

    chatInner.appendChild(
        welcome
    );


    if(messages.length){

        welcome.style.display =
            "none";


        messages.forEach(
            message => {

                renderMessage(
                    message
                );

            }
        );

    }else{

        welcome.style.display =
            "block";

    }


    scrollBottom();

    renderHistory();
}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(
    message
){

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "message " +
        message.role;


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar";


    avatar.textContent =
        message.role === "user"
            ? "ش"
            : "AI";


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "message-content";


    if(message.thinking){

        content.innerHTML =
            thinkingHTML();

    }

    else if(message.html){

        content.innerHTML =
            message.html;

    }

    else{

        if(
            message.role === "assistant"
        ){

            content.innerHTML =
                renderMarkdown(
                    message.content || ""
                );

            addCopyButtons(
                content
            );

        }else{

            content.textContent =
                message.content || "";

        }

    }


    row.appendChild(
        avatar
    );

    row.appendChild(
        content
    );


    chatInner.appendChild(
        row
    );


    return {
        row,
        content
    };

}


/* =====================================================
   THINKING HTML
===================================================== */

function thinkingHTML(){

    let bars = "";

    for(
        let i = 0;
        i < 12;
        i++
    ){

        bars += "<span></span>";

    }


    return `

        <div class="thinking">

            <div class="thinking-label">
                در حال فکر کردن...
            </div>

            <div class="wave">
                ${bars}
            </div>

        </div>

    `;

}


/* =====================================================
   RENDER MARKDOWN
===================================================== */

function renderMarkdown(
    text
){

    try{

        const html =
            marked.parse(
                text || ""
            );


        return DOMPurify.sanitize(
            html
        );

    }catch(error){

        return DOMPurify.sanitize(
            text || ""
        );

    }

}


/* =====================================================
   COPY BUTTONS
===================================================== */

function addCopyButtons(
    container
){

    const blocks =
        container.querySelectorAll(
            "pre"
        );


    blocks.forEach(
        block => {

            if(
                block.parentElement.classList.contains(
                    "code-box"
                )
            ){

                return;

            }


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                "code-box";


            block.parentNode.insertBefore(
                wrapper,
                block
            );


            wrapper.appendChild(
                block
            );


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "copy-code";


            button.textContent =
                "کپی";


            button.onclick =
                async () => {

                    const code =
                        block.innerText;


                    try{

                        await navigator.clipboard.writeText(
                            code
                        );

                        button.textContent =
                            "کپی شد ✓";


                        setTimeout(
                            () => {

                                button.textContent =
                                    "کپی";

                            },
                            1500
                        );

                    }catch(error){

                        button.textContent =
                            "خطا";

                    }

                };


            wrapper.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

    historyElement.innerHTML = "";


    const users =
        messages
            .filter(
                message =>
                    message.role === "user"
            )
            .slice(
                -15
            )
            .reverse();


    users.forEach(
        message => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "history-item";


            item.textContent =
                message.content
                    .replace(
                        /\s+/g,
                        " "
                    )
                    .slice(
                        0,
                        55
                    );


            historyElement.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

    requestAnimationFrame(
        () => {

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* =====================================================
   FILE
===================================================== */

attachButton.onclick =
    () => {

        fileInput.click();

    };


fileInput.onchange =
    () => {

        const file =
            fileInput.files[0];


        if(!file){

            clearFile();

            return;

        }


        selectedFile =
            file;


        filePreview.textContent =
            `📎 ${file.name}`;


        filePreview.classList.add(
            "active"
        );

    };


function clearFile(){

    selectedFile =
        null;

    fileInput.value =
        "";

    filePreview.textContent =
        "";

    filePreview.classList.remove(
        "active"
    );

}


/* =====================================================
   TEXTAREA
===================================================== */

input.addEventListener(
    "input",
    () => {

        input.style.height =
            "auto";


        input.style.height =
            Math.min(
                input.scrollHeight,
                180
            ) + "px";

    }
);


input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   FILE TO DATA URL
===================================================== */

function fileToDataURL(
    file
){

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () => resolve(
                    reader.result
                );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


/* =====================================================
   SEARCH STATUS
===================================================== */

function createSearchStatus(
    parent
){

    const status =
        document.createElement(
            "div"
        );


    status.className =
        "search-status active";


    status.innerHTML = `

        <span class="search-icon">
            🔎
        </span>

        <span>
            در حال جستجو در وب...
        </span>

    `;


    parent.appendChild(
        status
    );


    return status;

}


/* =====================================================
   SEND
===================================================== */

sendButton.onclick =
    sendMessage;


async function sendMessage(){

    if(isSending){

        return;

    }


    const text =
        input.value.trim();


    if(
        !text &&
        !selectedFile
    ){

        return;

    }


    isSending =
        true;


    sendButton.disabled =
        true;


    if(welcome){

        welcome.style.display =
            "none";

    }


    let userContent =
        text;


    /* ============================================
       IMAGE
    ============================================ */

    if(
        selectedFile &&
        selectedFile.type.startsWith(
            "image/"
        )
    ){

        try{

            const dataURL =
                await fileToDataURL(
                    selectedFile
                );


            userContent = [

                {
                    type:"text",
                    text:
                        text ||
                        "این تصویر را بررسی کن."
                },

                {
                    type:"image_url",

                    image_url:{
                        url:dataURL
                    }

                }

            ];

        }catch(error){

            console.error(
                error
            );

        }

    }


    /* ============================================
       VIDEO
    ============================================ */

    else if(
        selectedFile &&
        selectedFile.type.startsWith(
            "video/"
        )
    ){

        userContent = text
            ? `${text}\n\n[ویدئو پیوست شد: ${selectedFile.name}]`
            : `[ویدئو پیوست شد: ${selectedFile.name}]`;

    }


    /* ============================================
       SAVE USER MESSAGE
    ============================================ */

    const userMessage = {

        role:"user",

        content:
            typeof userContent === "string"
                ? userContent
                : text ||
                  `📎 ${selectedFile.name}`

    };


    messages.push(
        userMessage
    );


    /* ============================================
       SHOW USER IMMEDIATELY
    ============================================ */

    renderMessage(
        userMessage
    );


    scrollBottom();

    renderHistory();


    input.value =
        "";

    input.style.height =
        "auto";


    clearFile();


    /* ============================================
       THINKING MESSAGE
    ============================================ */

    const thinkingMessage = {

        role:"assistant",

        thinking:true

    };


    const thinkingUI =
        renderMessage(
            thinkingMessage
        );


    scrollBottom();


    try{

        /* ========================================
           BUILD REQUEST HISTORY
        ======================================== */

        const apiMessages =
            messages
                .slice(-MAX_HISTORY)
                .map(message => {

                    return {
                        role:message.role,
                        content:message.content
                    };

                });


        /* ========================================
           STREAM REQUEST
        ======================================== */

        const response =
            await fetch(
                API_STREAM,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        messages:
                            apiMessages
                    })
                }
            );


        /* ========================================
           NON-OK
        ======================================== */

        if(!response.ok){

            let errorText =
                await response.text();


            try{

                const json =
                    JSON.parse(
                        errorText
                    );

                errorText =
                    json.error ||
                    errorText;

            }catch(error){

                // plain text
            }


            throw new Error(
                errorText ||
                `سرور پاسخ نامعتبر داد. ${response.status} HTTP`
            );

        }


        if(!response.body){

            throw new Error(
                "مرورگر Streaming را پشتیبانی نمی‌کند."
            );

        }


        /* ========================================
           REMOVE THINKING
        ======================================== */

        thinkingUI.row.remove();


        /* ========================================
           CREATE ASSISTANT MESSAGE
        ======================================== */

        const assistantMessage = {

            role:"assistant",

            content:""

        };


        const assistantUI =
            renderMessage(
                assistantMessage
            );


        const contentElement =
            assistantUI.content;


        /* ========================================
           SEARCH STATUS
        ======================================== */

        let searchStatus =
            null;


        /* ========================================
           READER
        ======================================== */

        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder(
                "utf-8"
            );


        let buffer =
            "";


        let fullAnswer =
            "";


        /* ========================================
           READ STREAM
        ======================================== */

        while(true){

            const {
                value,
                done
            } =
                await reader.read();


            if(done){

                break;

            }


            buffer +=
                decoder.decode(
                    value,
                    {
                        stream:true
                    }
                );


            const events =
                buffer.split(
                    "\n\n"
                );


            buffer =
                events.pop() || "";


            for(
                const event
                of events
            ){

                const lines =
                    event.split(
                        "\n"
                    );


                for(
                    const line
                    of lines
                ){

                    if(
                        !line.startsWith(
                            "data:"
                        )
                    ){

                        continue;

                    }


                    const raw =
                        line
                            .slice(5)
                            .trim();


                    if(!raw){

                        continue;

                    }


                    let data;


                    try{

                        data =
                            JSON.parse(
                                raw
                            );

                    }catch(error){

                        continue;

                    }


                    /* =================================
                       SEARCH
                    ================================= */

                    if(
                        data.type ===
                        "search"
                    ){

                        if(
                            !searchStatus
                        ){

                            searchStatus =
                                createSearchStatus(
                                    contentElement
                                );

                        }


                        const text =
                            searchStatus.querySelector(
                                "span:last-child"
                            );


                        let queryText =
                            "در حال جستجو در وب...";


                        if(
                            data.arguments &&
                            data.arguments.trim()
                        ){

                            try{

                                const args =
                                    JSON.parse(
                                        data.arguments
                                    );


                                if(
                                    args.query
                                ){

                                    queryText =
                                        `در حال جستجو برای «${args.query}»...`;

                                }

                            }catch(error){

                                // arguments may arrive in chunks
                            }

                        }


                        text.textContent =
                            queryText;

                    }


                    /* =================================
                       CONTENT
                    ================================= */

                    if(
                        data.type ===
                        "content"
                    ){

                        fullAnswer +=
                            data.text;


                        assistantMessage.content =
                            fullAnswer;


                        if(
                            searchStatus
                        ){

                            searchStatus.remove();

                            searchStatus =
                                null;

                        }


                        contentElement.innerHTML =
                            renderMarkdown(
                                fullAnswer
                            );


                        addCopyButtons(
                            contentElement
                        );


                        scrollBottom();

                    }


                    /* =================================
                       ERROR
                    ================================= */

                    if(
                        data.type ===
                        "error"
                    ){

                        throw new Error(
                            data.message ||
                            "خطای Streaming"
                        );

                    }

                }

            }

        }


        /* ========================================
           FINAL SAVE
        ======================================== */

        if(!fullAnswer.trim()){

            fullAnswer =
                "مدل پاسخ متنی برنگرداند.";

            assistantMessage.content =
                fullAnswer;

            contentElement.textContent =
                fullAnswer;

        }


        messages.push({
            role:"assistant",
            content:fullAnswer
        });


        /* حذف نسخه اولیه‌ای که قبل از Stream داشتیم */
        const index =
            messages.indexOf(
                assistantMessage
            );


        if(index !== -1){

            messages.splice(
                index,
                1
            );

        }


        save();

        renderHistory();

        scrollBottom();


    }catch(error){

        console.error(
            "BEHRAD AI STREAM ERROR:",
            error
        );


        thinkingUI.row.remove();


        const errorMessage = {

            role:"assistant",

            content:
                "❌ " +
                (
                    error.message ||
                    "خطای ناشناخته"
                )

        };


        renderMessage(
            errorMessage
        );


        scrollBottom();

    }finally{

        isSending =
            false;


        sendButton.disabled =
            false;


        input.focus();

    }

}


/* =====================================================
   START
===================================================== */

input.focus();

</script>
