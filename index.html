<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BEHRAD AI</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #212121;
    color: #ececec;
    font-family: Tahoma, Arial, sans-serif;
}

body {
    overflow: hidden;
}

button,
textarea,
input {
    font-family: inherit;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    background: #212121;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    min-width: 260px;
    height: 100%;
    background: #171717;
    border-left: 1px solid #303030;
    display: flex;
    flex-direction: column;
}

.brand {
    padding: 22px 18px;
    border-bottom: 1px solid #303030;
}

.brand-title {
    font-size: 20px;
    font-weight: bold;
}

.brand-sub {
    margin-top: 6px;
    color: #9b9b9b;
    font-size: 12px;
}

.new-chat {
    margin: 14px;
    border: 1px solid #404040;
    background: #212121;
    color: #fff;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    transition: .2s;
}

.new-chat:hover {
    background: #2a2a2a;
}

.history {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.history-title {
    color: #888;
    font-size: 12px;
    padding: 8px 10px;
}

.history-item {
    padding: 10px;
    border-radius: 8px;
    color: #cfcfcf;
    font-size: 13px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.history-item:hover {
    background: #252525;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 58px;
    min-height: 58px;
    border-bottom: 1px solid #303030;
    display: flex;
    align-items: center;
    padding: 0 22px;
    background: #212121;
}

.model-name {
    font-size: 14px;
    color: #d7d7d7;
}

.model-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #10a37f;
    border-radius: 50%;
    margin-left: 8px;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px 150px;
}

.chat-inner {
    width: min(900px, 100%);
    margin: auto;
}

.message {
    display: flex;
    gap: 14px;
    margin: 0 auto 26px;
    line-height: 1.9;
}

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 13px;
}

.message.user .avatar {
    background: #444;
}

.message.assistant .avatar {
    background: #10a37f;
    color: #fff;
}

.message-content {
    flex: 1;
    min-width: 0;
    font-size: 15px;
}

.message.user .message-content {
    white-space: pre-wrap;
}

.message-content img {
    max-width: 100%;
    max-height: 450px;
    border-radius: 12px;
    margin-top: 10px;
}

.message-content video {
    max-width: 100%;
    max-height: 450px;
    border-radius: 12px;
    margin-top: 10px;
}

.message-content pre {
    direction: ltr;
    text-align: left;
    background: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 16px;
    overflow-x: auto;
    position: relative;
}

.message-content code {
    font-family: Consolas, monospace;
}

.message-content :not(pre) > code {
    background: #303030;
    padding: 2px 5px;
    border-radius: 5px;
}

.code-wrap {
    position: relative;
}

.copy-code {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #2b2b2b;
    border: 1px solid #444;
    color: #ddd;
    padding: 5px 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
}

.copy-code:hover {
    background: #3a3a3a;
}

/* THINKING */

.thinking {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #999;
    font-size: 13px;
}

.wave {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 20px;
}

.wave span {
    width: 3px;
    height: 7px;
    background: #10a37f;
    border-radius: 3px;
    animation: wave 1s infinite ease-in-out;
}

.wave span:nth-child(2) {
    animation-delay: .1s;
}

.wave span:nth-child(3) {
    animation-delay: .2s;
}

.wave span:nth-child(4) {
    animation-delay: .3s;
}

.wave span:nth-child(5) {
    animation-delay: .4s;
}

@keyframes wave {
    0%,
    100% {
        height: 6px;
    }

    50% {
        height: 18px;
    }
}

.search-status {
    color: #8f8f8f;
    font-size: 12px;
    margin-top: 7px;
}

/* COMPOSER */

.composer-area {
    position: fixed;
    bottom: 0;
    left: 260px;
    right: 0;
    background: linear-gradient(
        to top,
        #212121 65%,
        rgba(33,33,33,0)
    );
    padding: 30px 20px 20px;
}

.composer {
    width: min(900px, 100%);
    margin: auto;
    background: #2f2f2f;
    border: 1px solid #4a4a4a;
    border-radius: 15px;
    padding: 10px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
}

.attach {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    color: #bbb;
    cursor: pointer;
    font-size: 20px;
}

.attach:hover {
    color: #fff;
}

#messageInput {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 15px;
    line-height: 1.7;
    max-height: 180px;
    padding: 8px;
}

.send {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 9px;
    background: #10a37f;
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.send:hover {
    background: #0d8e6e;
}

.send:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.file-name {
    position: absolute;
    bottom: 82px;
    right: 50%;
    transform: translateX(50%);
    background: #303030;
    border: 1px solid #444;
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12px;
    display: none;
}

@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .composer-area {
        left: 0;
    }

    .chat {
        padding-left: 12px;
        padding-right: 12px;
    }

    .message-content {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-title">
                BEHRAD AI
            </div>

            <div class="brand-sub">
                AI Assistant • Space Bunny Alpha
            </div>
        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            ＋ گفتگوی جدید
        </button>

        <div class="history">

            <div class="history-title">
                تاریخچه
            </div>

            <div id="historyList"></div>

        </div>

    </aside>

    <main class="main">

        <div class="topbar">

            <div class="model-name">
                <span class="model-dot"></span>
                Space Bunny Alpha
            </div>

        </div>

        <div
            class="chat"
            id="chat"
        >

            <div
                class="chat-inner"
                id="chatInner"
            ></div>

        </div>

        <div class="composer-area">

            <div
                class="file-name"
                id="fileName"
            ></div>

            <div class="composer">

                <input
                    type="file"
                    id="fileInput"
                    accept="image/*,video/*"
                    hidden
                >

                <button
                    class="attach"
                    onclick="document.getElementById('fileInput').click()"
                    title="افزودن فایل"
                >
                    ＋
                </button>

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="پیامت رو بنویس..."
                ></textarea>

                <button
                    class="send"
                    id="sendButton"
                    onclick="sendMessage()"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<script>
"use strict";

const STORAGE_KEY = "behrad_ai_utf8_v2";

const MAX_HISTORY = 12;

let messages = [];

let selectedFile = null;

let sending = false;


/* -------------------------
   STORAGE
------------------------- */

function loadMessages() {

    try {

        const saved = localStorage.getItem(
            STORAGE_KEY
        );

        if (!saved) {
            return [];
        }

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) {
            return [];
        }

        return parsed;

    } catch (error) {

        console.error(error);

        return [];
    }
}


function saveMessages() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                messages.slice(-MAX_HISTORY)
            )
        );

    } catch (error) {

        console.error(
            "Storage error:",
            error
        );
    }
}


/* -------------------------
   MARKDOWN
------------------------- */

function markdownToHTML(text) {

    try {

        const raw = marked.parse(
            text || ""
        );

        return DOMPurify.sanitize(raw);

    } catch {

        return escapeHTML(text);
    }
}


function escapeHTML(text) {

    const div = document.createElement(
        "div"
    );

    div.textContent = text;

    return div.innerHTML;
}


/* -------------------------
   CODE COPY
------------------------- */

function addCopyButtons(container) {

    const blocks = container.querySelectorAll(
        "pre"
    );

    blocks.forEach(pre => {

        if (pre.parentElement.classList.contains(
            "code-wrap"
        )) {
            return;
        }

        const wrapper =
            document.createElement("div");

        wrapper.className = "code-wrap";

        pre.parentNode.insertBefore(
            wrapper,
            pre
        );

        wrapper.appendChild(pre);

        const button =
            document.createElement("button");

        button.className = "copy-code";

        button.textContent = "کپی";

        button.onclick = async () => {

            const code =
                pre.innerText;

            try {

                await navigator.clipboard.writeText(
                    code
                );

                button.textContent =
                    "کپی شد ✓";

                setTimeout(() => {
                    button.textContent =
                        "کپی";
                }, 1200);

            } catch {

                button.textContent =
                    "خطا";
            }
        };

        wrapper.appendChild(button);
    });
}


/* -------------------------
   RENDER MESSAGE
------------------------- */

function renderMessage(message) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        `message ${message.role}`;

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        message.role === "user"
            ? "تو"
            : "AI";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    if (message.role === "user") {

        if (typeof message.content === "string") {

            content.textContent =
                message.content;

        } else {

            const textPart =
                message.content.find(
                    x => x.type === "text"
                );

            content.textContent =
                textPart?.text || "";
        }

    } else {

        content.innerHTML =
            markdownToHTML(
                message.content || ""
            );

        addCopyButtons(content);
    }

    wrapper.appendChild(avatar);

    wrapper.appendChild(content);

    document.getElementById(
        "chatInner"
    ).appendChild(wrapper);

    return wrapper;
}


/* -------------------------
   RENDER ALL
------------------------- */

function renderAll() {

    const chat =
        document.getElementById(
            "chatInner"
        );

    chat.innerHTML = "";

    if (messages.length === 0) {

        const welcome =
            document.createElement("div");

        welcome.className =
            "message assistant";

        welcome.innerHTML = `
            <div class="avatar">AI</div>
            <div class="message-content">
                سلام رفیق 👋<br>
                من <b>BEHRAD AI</b> هستم.
                هرچی خواستی بپرس؛ از برنامه‌نویسی
                و پروژه گرفته تا جستجوی وب و توضیح مطالب.
            </div>
        `;

        chat.appendChild(welcome);

    } else {

        messages.forEach(
            renderMessage
        );
    }

    scrollBottom();

    renderHistory();
}


/* -------------------------
   HISTORY
------------------------- */

function renderHistory() {

    const list =
        document.getElementById(
            "historyList"
        );

    list.innerHTML = "";

    const userMessages =
        messages.filter(
            m => m.role === "user"
        );

    userMessages
        .slice(-10)
        .reverse()
        .forEach(message => {

            let text = "";

            if (
                typeof message.content ===
                "string"
            ) {

                text = message.content;

            } else {

                const part =
                    message.content.find(
                        x => x.type === "text"
                    );

                text = part?.text || "فایل";
            }

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";

            item.textContent =
                text || "گفتگو";

            list.appendChild(item);
        });
}


/* -------------------------
   SCROLL
------------------------- */

function scrollBottom() {

    const chat =
        document.getElementById(
            "chat"
        );

    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;
    });
}


/* -------------------------
   THINKING
------------------------- */

function createThinking() {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message assistant";

    wrapper.id =
        "thinkingMessage";

    wrapper.innerHTML = `
        <div class="avatar">AI</div>

        <div class="message-content">

            <div class="thinking">

                <div class="wave">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <span id="thinkingText">
                    در حال فکر کردن...
                </span>

            </div>

            <div
                class="search-status"
                id="searchStatus"
            ></div>

        </div>
    `;

    document.getElementById(
        "chatInner"
    ).appendChild(wrapper);

    scrollBottom();

    return wrapper;
}


/* -------------------------
   FILE
------------------------- */

document.getElementById(
    "fileInput"
).addEventListener(
    "change",
    event => {

        selectedFile =
            event.target.files[0] || null;

        const fileName =
            document.getElementById(
                "fileName"
            );

        if (selectedFile) {

            fileName.textContent =
                "📎 " + selectedFile.name;

            fileName.style.display =
                "block";

        } else {

            fileName.style.display =
                "none";
        }
    }
);


function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}


/* -------------------------
   SEND MESSAGE
------------------------- */

async function sendMessage() {

    if (sending) {
        return;
    }

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text && !selectedFile) {
        return;
    }

    sending = true;

    document.getElementById(
        "sendButton"
    ).disabled = true;

    let userContent = [];

    if (text) {

        userContent.push({
            type: "text",
            text: text
        });
    }

    let imageData = null;

    if (selectedFile) {

        if (
            selectedFile.type.startsWith(
                "image/"
            )
        ) {

            try {

                imageData =
                    await fileToDataURL(
                        selectedFile
                    );

                userContent.push({
                    type: "image_url",
                    image_url: {
                        url: imageData
                    }
                });

            } catch {

                userContent.push({
                    type: "text",
                    text:
                        `[تصویر پیوست شد: ${selectedFile.name}]`
                });
            }

        } else if (
            selectedFile.type.startsWith(
                "video/"
            )
        ) {

            userContent.push({
                type: "text",
                text:
                    `[ویدئو پیوست شد: ${selectedFile.name}]`
            });
        }
    }

    const userMessage = {
        role: "user",
        content: userContent
    };

    /*
       خیلی مهم:
       پیام کاربر همین لحظه روی صفحه می‌آید،
       نه بعد از پاسخ سرور.
    */

    messages.push(userMessage);

    renderMessage(userMessage);

    saveMessages();

    scrollBottom();

    input.value = "";

    selectedFile = null;

    document.getElementById(
        "fileInput"
    ).value = "";

    document.getElementById(
        "fileName"
    ).style.display = "none";


    const thinking =
        createThinking();


    let assistantText = "";

    try {

        const response =
            await fetch(
                "/api/chat/stream",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json; charset=UTF-8",
                        "Accept":
                            "text/event-stream"
                    },

                    body: JSON.stringify({
                        messages:
                            messages.slice(
                                -MAX_HISTORY
                            )
                    })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `HTTP ${response.status}: ${errorText}`
            );
        }


        if (!response.body) {

            throw new Error(
                "مرورگر Stream را پشتیبانی نمی‌کند."
            );
        }


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder(
                "utf-8"
            );

        let buffer = "";

        let assistantElement = null;


        while (true) {

            const {
                value,
                done
            } =
                await reader.read();

            if (done) {
                break;
            }

            /*
                مهم:
                stream همیشه UTF-8 است.
            */

            buffer +=
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            const events =
                buffer.split(
                    "\n\n"
                );

            buffer =
                events.pop() || "";


            for (
                const eventText
                of events
            ) {

                let eventName =
                    "message";

                let dataText = "";


                for (
                    const line
                    of eventText.split(
                        "\n"
                    )
                ) {

                    if (
                        line.startsWith(
                            "event:"
                        )
                    ) {

                        eventName =
                            line
                                .slice(6)
                                .trim();

                    } else if (
                        line.startsWith(
                            "data:"
                        )
                    ) {

                        dataText +=
                            line
                                .slice(5)
                                .trim();
                    }
                }


                if (!dataText) {
                    continue;
                }


                let data;

                try {

                    data =
                        JSON.parse(
                            dataText
                        );

                } catch {

                    continue;
                }


                /* SEARCH */

                if (
                    eventName ===
                    "search"
                ) {

                    const searchStatus =
                        document.getElementById(
                            "searchStatus"
                        );

                    if (searchStatus) {

                        searchStatus.textContent =
                            "🌐 " +
                            (
                                data.status ||
                                "در حال جستجوی وب..."
                            );
                    }

                    continue;
                }


                /* REASONING */

                if (
                    eventName ===
                    "reasoning"
                ) {

                    const thinkingText =
                        document.getElementById(
                            "thinkingText"
                        );

                    if (thinkingText) {

                        thinkingText.textContent =
                            "در حال فکر کردن...";
                    }

                    continue;
                }


                /* ERROR */

                if (
                    eventName ===
                    "error"
                ) {

                    throw new Error(
                        data.message ||
                        "خطای ناشناخته"
                    );
                }


                /* TOKEN */

                if (
                    eventName ===
                    "token"
                ) {

                    const token =
                        data.text || "";

                    assistantText +=
                        token;


                    /*
                        اولین توکن که آمد،
                        موج فکر کردن تبدیل به پیام واقعی می‌شود.
                    */

                    if (!assistantElement) {

                        thinking.remove();

                        assistantElement =
                            document.createElement(
                                "div"
                            );

                        assistantElement.className =
                            "message assistant";

                        assistantElement.innerHTML = `
                            <div class="avatar">AI</div>
                            <div class="message-content"></div>
                        `;

                        document.getElementById(
                            "chatInner"
                        ).appendChild(
                            assistantElement
                        );
                    }


                    const content =
                        assistantElement.querySelector(
                            ".message-content"
                        );

                    content.innerHTML =
                        markdownToHTML(
                            assistantText
                        );

                    addCopyButtons(
                        content
                    );

                    scrollBottom();
                }


                /* DONE */

                if (
                    eventName ===
                    "done"
                ) {

                    if (
                        assistantElement
                    ) {

                        const content =
                            assistantElement.querySelector(
                                ".message-content"
                            );

                        content.innerHTML =
                            markdownToHTML(
                                assistantText
                            );

                        addCopyButtons(
                            content
                        );
                    }
                }
            }
        }


        /*
            اگر پاسخ خالی بود
        */

        if (
            !assistantText.trim()
        ) {

            if (
                thinking &&
                thinking.parentNode
            ) {

                thinking.remove();
            }

            throw new Error(
                "مدل هیچ پاسخ متنی برنگرداند."
            );
        }


        messages.push({
            role: "assistant",
            content:
                assistantText
        });

        saveMessages();

        renderHistory();

        scrollBottom();

    } catch (error) {

        console.error(
            "BEHRAD AI ERROR:",
            error
        );

        if (
            thinking &&
            thinking.parentNode
        ) {

            thinking.remove();
        }

        const errorMessage =
            document.createElement(
                "div"
            );

        errorMessage.className =
            "message assistant";

        errorMessage.innerHTML = `
            <div class="avatar">AI</div>

            <div class="message-content">
                ❌ ${escapeHTML(
                    error.message ||
                    "خطای ناشناخته"
                )}
            </div>
        `;

        document.getElementById(
            "chatInner"
        ).appendChild(
            errorMessage
        );

        scrollBottom();

    } finally {

        sending = false;

        document.getElementById(
            "sendButton"
        ).disabled = false;

        input.focus();
    }
}


/* -------------------------
   NEW CHAT
------------------------- */

function newChat() {

    messages = [];

    localStorage.removeItem(
        STORAGE_KEY
    );

    renderAll();
}


/* -------------------------
   ENTER
------------------------- */

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);


/* -------------------------
   AUTO RESIZE
------------------------- */

document.getElementById(
    "messageInput"
).addEventListener(
    "input",
    function () {

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                180
            ) + "px";
    }
);


/* -------------------------
   START
------------------------- */

messages =
    loadMessages();

renderAll();

document.getElementById(
    "messageInput"
).focus();

</script>

</body>
</html>
